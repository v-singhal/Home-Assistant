blueprint:
  name: 🥵🥶 Boiler heat demand from radiator thermostats
  description: >
    Uses selected radiator climate entities as room-demand inputs and a
    boiler-connected climate thermostat to call for heat. Each radiator
    can optionally use a dedicated 1:1 temperature sensor instead of its own
    current_temperature attribute. Blank inputs are ignored. If any selected
    radiator or active sensor is unavailable or invalid, the central thermostat
    is left unchanged.
  domain: automation
  input:
    boiler_thermostat:
      name: Boiler-connected central thermostat
      description: Climate entity that controls the boiler.
      selector:
        entity:
          filter:
            - domain: climate
    room_thermostat_1:
      name: Radiator thermostat 1 (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: climate
    room_temp_sensor_1:
      name: Room temperature sensor 1 (optional, overrides thermostat temp)
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    room_thermostat_2:
      name: Radiator thermostat 2 (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: climate
    room_temp_sensor_2:
      name: Room temperature sensor 2 (optional, overrides thermostat temp)
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    room_thermostat_3:
      name: Radiator thermostat 3 (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: climate
    room_temp_sensor_3:
      name: Room temperature sensor 3 (optional, overrides thermostat temp)
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    room_thermostat_4:
      name: Radiator thermostat 4 (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: climate
    room_temp_sensor_4:
      name: Room temperature sensor 4 (optional, overrides thermostat temp)
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    room_thermostat_5:
      name: Radiator thermostat 5 (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: climate
    room_temp_sensor_5:
      name: Room temperature sensor 5 (optional, overrides thermostat temp)
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    room_thermostat_6:
      name: Radiator thermostat 6 (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: climate
    room_temp_sensor_6:
      name: Room temperature sensor 6 (optional, overrides thermostat temp)
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    room_thermostat_7:
      name: Radiator thermostat 7 (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: climate
    room_temp_sensor_7:
      name: Room temperature sensor 7 (optional, overrides thermostat temp)
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    room_thermostat_8:
      name: Radiator thermostat 8 (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: climate
    room_temp_sensor_8:
      name: Room temperature sensor 8 (optional, overrides thermostat temp)
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    room_thermostat_9:
      name: Radiator thermostat 9 (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: climate
    room_temp_sensor_9:
      name: Room temperature sensor 9 (optional, overrides thermostat temp)
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    room_thermostat_10:
      name: Radiator thermostat 10 (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: climate
    room_temp_sensor_10:
      name: Room temperature sensor 10 (optional, overrides thermostat temp)
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    room_margin:
      name: Room temperature margin
      description: >
        A room requests heat when its measured temperature is below its target
        minus this margin. Values use Home Assistant's temperature unit.
      default: 0.4
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          mode: box
    call_boost:
      name: Central thermostat boost
      description: >
        Add this amount to the central thermostat's measured temperature when
        requesting heat. Values use Home Assistant's temperature unit.
      default: 2
      selector:
        number:
          min: 0.1
          max: 20
          step: 0.1
          mode: box
    max_call_temperature:
      name: Maximum central target
      description: >
        Upper cap for the central target. Set it within the central
        thermostat's supported range, and above its measured temperature
        whenever heat may be requested. Values use Home Assistant's
        temperature unit.
      default: 25
      selector:
        number:
          min: 1
          max: 100
          step: 0.1
          mode: box

triggers:
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id: !input boiler_thermostat
    attribute: current_temperature
  - trigger: template
    value_template: >-
      {% set margin = ('!input room_margin' | float) %}
      {% set pairs = [
        ('!input room_thermostat_1', '!input room_temp_sensor_1'),
        ('!input room_thermostat_2', '!input room_temp_sensor_2'),
        ('!input room_thermostat_3', '!input room_temp_sensor_3'),
        ('!input room_thermostat_4', '!input room_temp_sensor_4'),
        ('!input room_thermostat_5', '!input room_temp_sensor_5'),
        ('!input room_thermostat_6', '!input room_temp_sensor_6'),
        ('!input room_thermostat_7', '!input room_temp_sensor_7'),
        ('!input room_thermostat_8', '!input room_temp_sensor_8'),
        ('!input room_thermostat_9', '!input room_temp_sensor_9'),
        ('!input room_thermostat_10', '!input room_temp_sensor_10')
      ] %}
      {% set ns = namespace(demand=false) %}
      {% for t, s in pairs %}
        {% if t not in ['', none] and states(t) not in ['off', 'unknown', 'unavailable'] %}
          {% set use_s = (s not in ['', none]) %}
          {% set cur = states(s) if use_s else state_attr(t, 'current_temperature') %}
          {% set tgt = state_attr(t, 'temperature') %}
          {% if (not use_s or states(s) not in ['unknown', 'unavailable'])
                and is_number(cur)
                and is_number(tgt)
                and (cur | float) < ((tgt | float) - margin) %}
            {% set ns.demand = true %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {{ ns.demand }}

variables:
  boiler_entity: !input boiler_thermostat
  room_margin_value: !input room_margin
  call_boost_value: !input call_boost
  max_call_temperature_value: !input max_call_temperature

  room_pairs_raw:
    - thermostat: !input room_thermostat_1
      sensor: !input room_temp_sensor_1
    - thermostat: !input room_thermostat_2
      sensor: !input room_temp_sensor_2
    - thermostat: !input room_thermostat_3
      sensor: !input room_temp_sensor_3
    - thermostat: !input room_thermostat_4
      sensor: !input room_temp_sensor_4
    - thermostat: !input room_thermostat_5
      sensor: !input room_temp_sensor_5
    - thermostat: !input room_thermostat_6
      sensor: !input room_temp_sensor_6
    - thermostat: !input room_thermostat_7
      sensor: !input room_temp_sensor_7
    - thermostat: !input room_thermostat_8
      sensor: !input room_temp_sensor_8
    - thermostat: !input room_thermostat_9
      sensor: !input room_temp_sensor_9
    - thermostat: !input room_thermostat_10
      sensor: !input room_temp_sensor_10

  active_rooms: >-
    {% set items = [] %}
    {% for pair in room_pairs_raw %}
      {% set t = pair.thermostat %}
      {% set s = pair.sensor %}
      {% if t not in ['', none] %}
        {% set use_sensor = (s not in ['', none]) %}
        {% set current_val = states(s) if use_sensor else state_attr(t, 'current_temperature') %}
        {% set current_valid = (
          (not use_sensor or states(s) not in ['unknown', 'unavailable'])
          and is_number(current_val)
        ) %}
        {% set target_val = state_attr(t, 'temperature') %}
        {% set target_valid = is_number(target_val) %}
        {% set state_valid = states(t) not in ['unknown', 'unavailable'] %}
        {% set items = items + [{
          'thermostat': t,
          'sensor': s if use_sensor else '',
          'use_sensor': use_sensor,
          'state_valid': state_valid,
          'current': (current_val | float) if current_valid else none,
          'current_valid': current_valid,
          'target': (target_val | float) if target_valid else none,
          'target_valid': target_valid,
          'hvac_mode': states(t)
        }] %}
      {% endif %}
    {% endfor %}
    {{ items }}

  room_readings_valid: >-
    {% set ns = namespace(valid=true) %}
    {% for room in active_rooms %}
      {% if not room.state_valid or not room.current_valid or not room.target_valid %}
        {% set ns.valid = false %}
      {% endif %}
    {% endfor %}
    {{ ns.valid }}

  room_needs_heat: >-
    {% set ns = namespace(demand=false) %}
    {% for room in active_rooms %}
      {% if room.state_valid
            and room.current_valid
            and room.target_valid
            and room.hvac_mode != 'off'
            and room.current < (room.target - (room_margin_value | float)) %}
        {% set ns.demand = true %}
      {% endif %}
    {% endfor %}
    {{ ns.demand }}

  central_current_temperature: >-
    {{ state_attr(boiler_entity, 'current_temperature') }}

  central_target_step: >-
    {% set reported_step = state_attr(boiler_entity, 'target_temp_step') %}
    {% if is_number(reported_step) and (reported_step | float) > 0 %}
      {{ reported_step | float }}
    {% else %}
      0.1
    {% endif %}

  central_effective_max: >-
    {% set configured_max = max_call_temperature_value | float %}
    {% set device_max = state_attr(boiler_entity, 'max_temp') %}
    {% if is_number(device_max) %}
      {{ [configured_max, (device_max | float)] | min }}
    {% else %}
      {{ configured_max }}
    {% endif %}

  boiler_call_target: >-
    {% set current = central_current_temperature %}
    {% set step = central_target_step | float %}
    {% set cap = central_effective_max | float %}
    {% if is_number(current) and step > 0 %}
      {% set desired = (current | float) + (call_boost_value | float) %}
      {% set rounded_up = ((desired / step) | round(0, 'ceil')) * step %}
      {% set aligned_cap = ((cap / step) | round(0, 'floor')) * step %}
      {{ ([rounded_up, aligned_cap] | min) | round(2) }}
    {% else %}
      0
    {% endif %}

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ active_rooms | count > 0
                 and room_readings_valid
                 and room_needs_heat
                 and states(boiler_entity) not in ['unknown', 'unavailable']
                 and 'heat' in (state_attr(boiler_entity, 'hvac_modes') or [])
                 and is_number(central_current_temperature)
                 and (boiler_call_target | float) > (central_current_temperature | float) }}
        sequence:
          - if:
              - condition: template
                value_template: >-
                  {% set current_target = state_attr(boiler_entity, 'temperature') %}
                  {{ states(boiler_entity) != 'heat'
                     or not is_number(current_target)
                     or (((current_target | float) - (boiler_call_target | float)) | abs) > 0.05 }}
            then:
              - action: climate.set_temperature
                target:
                  entity_id: !input boiler_thermostat
                data:
                  hvac_mode: heat
                  temperature: "{{ boiler_call_target | float }}"

      - conditions:
          - condition: template
            value_template: >-
              {{ active_rooms | count > 0
                 and room_readings_valid
                 and not room_needs_heat
                 and states(boiler_entity) not in ['unknown', 'unavailable']
                 and 'off' in (state_attr(boiler_entity, 'hvac_modes') or [])
                 and states(boiler_entity) != 'off' }}
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input boiler_thermostat
            data:
              hvac_mode: "off"

mode: restart
