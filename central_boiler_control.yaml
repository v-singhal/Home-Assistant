blueprint:
  name: 🥶🌡️ [Thermostat] Central boiler control with radiator demand and paired thermostat sync
  description: >
    Controls a central boiler-connected climate thermostat from up to ten
    radiator thermostats. Optionally synchronizes HVAC mode and target
    temperature bidirectionally with one paired radiator thermostat.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"

  input:
    central_thermostat:
      name: Central thermostat
      selector:
        entity:
          domain: climate

    paired_radiator:
      name: Paired radiator thermostat
      description: Optional climate entity to synchronize with the central thermostat.
      default: ""
      selector:
        entity:
          domain: climate

    sync_helper:
      name: Automation-change helper
      description: Select the input_boolean used to prevent synchronization loops.
      selector:
        entity:
          domain: input_boolean

    radiator_1:
      name: Radiator thermostat 1
      default: ""
      selector:
        entity:
          domain: climate
    radiator_1_sensor:
      name: Radiator 1 external temperature sensor
      description: Optional; replaces the thermostat's current_temperature.
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature

    radiator_2:
      name: Radiator thermostat 2
      default: ""
      selector:
        entity:
          domain: climate
    radiator_2_sensor:
      name: Radiator 2 external temperature sensor
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature

    radiator_3:
      name: Radiator thermostat 3
      default: ""
      selector:
        entity:
          domain: climate
    radiator_3_sensor:
      name: Radiator 3 external temperature sensor
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature

    radiator_4:
      name: Radiator thermostat 4
      default: ""
      selector:
        entity:
          domain: climate
    radiator_4_sensor:
      name: Radiator 4 external temperature sensor
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature

    radiator_5:
      name: Radiator thermostat 5
      default: ""
      selector:
        entity:
          domain: climate
    radiator_5_sensor:
      name: Radiator 5 external temperature sensor
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature

    radiator_6:
      name: Radiator thermostat 6
      default: ""
      selector:
        entity:
          domain: climate
    radiator_6_sensor:
      name: Radiator 6 external temperature sensor
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature

    radiator_7:
      name: Radiator thermostat 7
      default: ""
      selector:
        entity:
          domain: climate
    radiator_7_sensor:
      name: Radiator 7 external temperature sensor
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature

    radiator_8:
      name: Radiator thermostat 8
      default: ""
      selector:
        entity:
          domain: climate
    radiator_8_sensor:
      name: Radiator 8 external temperature sensor
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature

    radiator_9:
      name: Radiator thermostat 9
      default: ""
      selector:
        entity:
          domain: climate
    radiator_9_sensor:
      name: Radiator 9 external temperature sensor
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature

    radiator_10:
      name: Radiator thermostat 10
      default: ""
      selector:
        entity:
          domain: climate
    radiator_10_sensor:
      name: Radiator 10 external temperature sensor
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature

    temperature_margin:
      name: Temperature margin
      description: Request heat when room temperature is below target minus this value.
      default: 0.5
      selector:
        number:
          min: 0
          max: 5
          step: 0.1
          mode: box
          unit_of_measurement: "°C"

    central_boost:
      name: Central thermostat boost
      description: Added to the central thermostat's current temperature when calculating its target.
      default: 2
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          mode: box
          unit_of_measurement: "°C"

    maximum_central_temperature:
      name: Maximum central target temperature
      default: 25
      selector:
        number:
          min: 5
          max: 40
          step: 0.5
          mode: box
          unit_of_measurement: "°C"

    debounce_seconds:
      name: Debounce delay
      default: 2
      selector:
        number:
          min: 0
          max: 60
          step: 1
          mode: box
          unit_of_measurement: seconds

variables:
  central_entity: !input central_thermostat
  paired_entity: !input paired_radiator
  sync_helper_entity: !input sync_helper
  margin: !input temperature_margin
  boost: !input central_boost
  configured_max: !input maximum_central_temperature
  debounce: !input debounce_seconds

  radiator_1_entity: !input radiator_1
  radiator_2_entity: !input radiator_2
  radiator_3_entity: !input radiator_3
  radiator_4_entity: !input radiator_4
  radiator_5_entity: !input radiator_5
  radiator_6_entity: !input radiator_6
  radiator_7_entity: !input radiator_7
  radiator_8_entity: !input radiator_8
  radiator_9_entity: !input radiator_9
  radiator_10_entity: !input radiator_10

  radiator_1_sensor_entity: !input radiator_1_sensor
  radiator_2_sensor_entity: !input radiator_2_sensor
  radiator_3_sensor_entity: !input radiator_3_sensor
  radiator_4_sensor_entity: !input radiator_4_sensor
  radiator_5_sensor_entity: !input radiator_5_sensor
  radiator_6_sensor_entity: !input radiator_6_sensor
  radiator_7_sensor_entity: !input radiator_7_sensor
  radiator_8_sensor_entity: !input radiator_8_sensor
  radiator_9_sensor_entity: !input radiator_9_sensor
  radiator_10_sensor_entity: !input radiator_10_sensor

  radiators_raw: >-
    {{ [
      radiator_1_entity, radiator_2_entity, radiator_3_entity, radiator_4_entity,
      radiator_5_entity, radiator_6_entity, radiator_7_entity, radiator_8_entity,
      radiator_9_entity, radiator_10_entity
    ] }}
  sensors_raw: >-
    {{ [
      radiator_1_sensor_entity, radiator_2_sensor_entity, radiator_3_sensor_entity,
      radiator_4_sensor_entity, radiator_5_sensor_entity, radiator_6_sensor_entity,
      radiator_7_sensor_entity, radiator_8_sensor_entity, radiator_9_sensor_entity,
      radiator_10_sensor_entity
    ] }}
  monitored_thermostats: >-
    {{ radiators_raw | reject('equalto', '') | list }}
  watched_entities: >-
    {{ ([central_entity, paired_entity] + radiators_raw + sensors_raw)
       | reject('equalto', '') | list }}

trigger:
  - platform: homeassistant
    event: start
    id: startup

  - platform: time_pattern
    minutes: "/5"
    id: periodic

  - platform: state
    entity_id: !input central_thermostat
    attribute: current_temperature
    id: central_temperature

  - platform: event
    event_type: state_changed
    id: entity_event

condition:
  - condition: or
    conditions:
      - condition: template
        value_template: "{{ trigger.id != 'entity_event' }}"
      - condition: template
        value_template: >-
          {{ trigger.event.data.entity_id in watched_entities }}

action:
  - delay:
      seconds: "{{ debounce | int(0) }}"

  # If the helper is already on, reset it and skip sync for this event.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ is_state(sync_helper_entity, 'on') }}"
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id: "{{ sync_helper_entity }}"

      # Sync only central or paired thermostat changes. Other radiator
      # thermostats do not initiate synchronization.
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'entity_event'
                 and paired_entity != ''
                 and is_state(sync_helper_entity, 'off')
                 and (
                   (
                     trigger.event.data.entity_id == central_entity
                     and trigger.event.data.entity_id not in monitored_thermostats
                   )
                   or trigger.event.data.entity_id == paired_entity
                 ) }}
        sequence:
          - variables:
              sync_source: >-
                {{ central_entity
                   if trigger.event.data.entity_id == central_entity
                   else paired_entity }}
              sync_destination: >-
                {{ paired_entity
                   if trigger.event.data.entity_id == central_entity
                   else central_entity }}

          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ states(sync_source) not in ['unknown', 'unavailable', '']
                         and states(sync_source) != states(sync_destination) }}
                sequence:
                  - service: input_boolean.turn_on
                    target:
                      entity_id: "{{ sync_helper_entity }}"
                  - service: climate.set_hvac_mode
                    target:
                      entity_id: "{{ sync_destination }}"
                    data:
                      hvac_mode: "{{ states(sync_source) }}"

          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ is_number(state_attr(sync_source, 'temperature'))
                         and (
                           not is_number(state_attr(sync_destination, 'temperature'))
                           or
                           (state_attr(sync_source, 'temperature')
                            - state_attr(sync_destination, 'temperature')) | abs > 0.05
                         ) }}
                sequence:
                  - service: input_boolean.turn_on
                    target:
                      entity_id: "{{ sync_helper_entity }}"
                  - service: climate.set_temperature
                    target:
                      entity_id: "{{ sync_destination }}"
                    data:
                      temperature: >-
                        {% set step = state_attr(sync_destination, 'target_temp_step') | float(0.1) %}
                        {% set step = step if step > 0 else 0.1 %}
                        {{ ((state_attr(sync_source, 'temperature') | float / step) | round(0)) * step }}

  - variables:
      selected_radiator_count: >-
        {{ radiators_raw | reject('equalto', '') | list | length }}

      radiator_data_invalid: >-
        {% set ns = namespace(invalid=false) %}
        {% for index in range(0, 10) %}
          {% set entity = radiators_raw[index] %}
          {% set sensor = sensors_raw[index] %}
          {% if entity != '' %}
            {% set mode = states(entity) %}
            {% if mode in ['unknown', 'unavailable', ''] %}
              {% set ns.invalid = true %}
            {% elif mode != 'off' %}
              {% set target = state_attr(entity, 'temperature') %}
              {% if sensor != '' %}
                {% set measured = states(sensor) %}
              {% else %}
                {% set measured = state_attr(entity, 'current_temperature') %}
              {% endif %}
              {% if not is_number(target) or not is_number(measured) %}
                {% set ns.invalid = true %}
              {% endif %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.invalid }}

      room_demands: >-
        {% set ns = namespace(demands=[]) %}
        {% for index in range(0, 10) %}
          {% set entity = radiators_raw[index] %}
          {% set sensor = sensors_raw[index] %}
          {% if entity != '' and states(entity) not in ['unknown', 'unavailable', '', 'off'] %}
            {% set target = state_attr(entity, 'temperature') %}
            {% if sensor != '' %}
              {% set measured = states(sensor) %}
            {% else %}
              {% set measured = state_attr(entity, 'current_temperature') %}
            {% endif %}
            {% if is_number(target) and is_number(measured)
                  and (measured | float) < ((target | float) - (margin | float)) %}
              {% set ns.demands = ns.demands + [target | float] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.demands }}

      central_current_temperature: >-
        {{ state_attr(central_entity, 'current_temperature') }}

      device_maximum: >-
        {{ state_attr(central_entity, 'max_temp') }}

      effective_maximum: >-
        {% if is_number(device_maximum) %}
          {{ [configured_max | float, device_maximum | float] | min }}
        {% else %}
          {{ configured_max | float }}
        {% endif %}

      raw_central_target: >-
        {% set current = central_current_temperature | float(0) %}
        {% set highest_room_target = (room_demands | max) if room_demands | length > 0 else current %}
        {{ [highest_room_target, current + (boost | float)] | max }}

      central_target_step: >-
        {% set step = state_attr(central_entity, 'target_temp_step') | float(0.1) %}
        {{ step if step > 0 else 0.1 }}

      rounded_central_target: >-
        {% set rounded = ((raw_central_target | float / central_target_step | float) | round(0))
                         * (central_target_step | float) %}
        {{ [rounded, effective_maximum | float] | min }}

  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ selected_radiator_count | int > 0
                 and not (radiator_data_invalid | bool)
                 and is_number(central_current_temperature)
                 and room_demands | length > 0 }}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ states(central_entity) != 'heat' }}"
                sequence:
                  - service: input_boolean.turn_on
                    target:
                      entity_id: "{{ sync_helper_entity }}"
                  - service: climate.set_hvac_mode
                    target:
                      entity_id: "{{ central_entity }}"
                    data:
                      hvac_mode: heat

          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ is_number(state_attr(central_entity, 'temperature'))
                         and
                         (state_attr(central_entity, 'temperature')
                          - (rounded_central_target | float)) | abs > 0.05 }}
                sequence:
                  - service: input_boolean.turn_on
                    target:
                      entity_id: "{{ sync_helper_entity }}"
                  - service: climate.set_temperature
                    target:
                      entity_id: "{{ central_entity }}"
                    data:
                      temperature: "{{ rounded_central_target | float }}"

      - conditions:
          - condition: template
            value_template: >-
              {{ selected_radiator_count | int > 0
                 and not (radiator_data_invalid | bool)
                 and is_number(central_current_temperature)
                 and room_demands | length == 0 }}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ states(central_entity) != 'off' }}"
                sequence:
                  - service: input_boolean.turn_on
                    target:
                      entity_id: "{{ sync_helper_entity }}"
                  - service: climate.set_hvac_mode
                    target:
                      entity_id: "{{ central_entity }}"
                    data:
                      hvac_mode: "off"

mode: queued
max: 10
