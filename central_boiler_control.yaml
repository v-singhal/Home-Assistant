blueprint:
  name: 🥶🌡️ Boiler demand from radiator thermostats with paired thermostat sync
  description: >-
    Controls a boiler-connected central climate thermostat from up to 10
    radiator climate entities. Optionally synchronizes HVAC mode and target
    temperature between the central thermostat and one paired climate entity.
    The automation-change input_boolean suppresses sync loops when another
    automation changes either paired thermostat.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"

  input:
    central_thermostat:
      name: Boiler-connected thermostat
      description: Required climate entity that controls the boiler.
      selector:
        entity:
          filter:
            - domain: climate

    pairing_settings:
      name: Central thermostat pairing
      input:
        paired_thermostat:
          name: Paired radiator thermostat
          description: >-
            Climate entity to synchronize bidirectionally with the central
            thermostat. Leave blank to disable pairing.
          default: ""
          selector:
            entity:
              filter:
                - domain: climate

        automation_change_helper:
          name: Automation-change helper
          description: >-
            Input boolean set to on by your other automation before an
            automation-generated change to either paired thermostat. This
            blueprint checks it and resets it to off.
          selector:
            entity:
              filter:
                - domain: input_boolean

    radiator_room_1:
      name: Radiator 1
      input:
        radiator_1:
          name: Radiator thermostat
          default: ""
          selector:
            entity:
              filter:
                - domain: climate
        temperature_sensor_1:
          name: Corresponding temperature sensor (optional)
          description: Leave blank to use the radiator thermostat's current_temperature.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor

    radiator_room_2:
      name: Radiator 2
      input:
        radiator_2:
          name: Radiator thermostat
          default: ""
          selector:
            entity:
              filter:
                - domain: climate
        temperature_sensor_2:
          name: Corresponding temperature sensor (optional)
          description: Leave blank to use the radiator thermostat's current_temperature.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor

    radiator_room_3:
      name: Radiator 3
      input:
        radiator_3:
          name: Radiator thermostat
          default: ""
          selector:
            entity:
              filter:
                - domain: climate
        temperature_sensor_3:
          name: Corresponding temperature sensor (optional)
          description: Leave blank to use the radiator thermostat's current_temperature.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor

    radiator_room_4:
      name: Radiator 4
      input:
        radiator_4:
          name: Radiator thermostat
          default: ""
          selector:
            entity:
              filter:
                - domain: climate
        temperature_sensor_4:
          name: Corresponding temperature sensor (optional)
          description: Leave blank to use the radiator thermostat's current_temperature.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor

    radiator_room_5:
      name: Radiator 5
      input:
        radiator_5:
          name: Radiator thermostat
          default: ""
          selector:
            entity:
              filter:
                - domain: climate
        temperature_sensor_5:
          name: Corresponding temperature sensor (optional)
          description: Leave blank to use the radiator thermostat's current_temperature.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor

    radiator_room_6:
      name: Radiator 6
      input:
        radiator_6:
          name: Radiator thermostat
          default: ""
          selector:
            entity:
              filter:
                - domain: climate
        temperature_sensor_6:
          name: Corresponding temperature sensor (optional)
          description: Leave blank to use the radiator thermostat's current_temperature.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor

    radiator_room_7:
      name: Radiator 7
      input:
        radiator_7:
          name: Radiator thermostat
          default: ""
          selector:
            entity:
              filter:
                - domain: climate
        temperature_sensor_7:
          name: Corresponding temperature sensor (optional)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor

    radiator_room_8:
      name: Radiator 8
      input:
        radiator_8:
          name: Radiator thermostat
          default: ""
          selector:
            entity:
              filter:
                - domain: climate
        temperature_sensor_8:
          name: Corresponding temperature sensor (optional)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor

    radiator_room_9:
      name: Radiator 9
      input:
        radiator_9:
          name: Radiator thermostat
          default: ""
          selector:
            entity:
              filter:
                - domain: climate
        temperature_sensor_9:
          name: Corresponding temperature sensor (optional)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor

    radiator_room_10:
      name: Radiator 10
      input:
        radiator_10:
          name: Radiator thermostat
          default: ""
          selector:
            entity:
              filter:
                - domain: climate
        temperature_sensor_10:
          name: Corresponding temperature sensor (optional)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor

    temperature_settings:
      name: Temperature and timing settings
      input:
        room_temperature_margin:
          name: Room temperature margin
          description: A room needs heat below its target minus this margin.
          default: 0.5
          selector:
            number:
              min: 0
              max: 10
              step: 0.1
              mode: box
              unit_of_measurement: "°"

        central_temperature_boost:
          name: Central thermostat boost
          description: Added to the central thermostat's measured temperature.
          default: 2
          selector:
            number:
              min: 0.1
              max: 20
              step: 0.1
              mode: box
              unit_of_measurement: "°"

        central_maximum_target:
          name: Central thermostat maximum target
          description: >-
            Upper cap for the central thermostat target. Set this within its
            supported temperature range.
          default: 25
          selector:
            number:
              min: -50
              max: 100
              step: 0.1
              mode: box
              unit_of_measurement: "°"

        debounce_seconds:
          name: Debounce delay
          description: >-
            Wait this many seconds after a trigger, then evaluate the latest
            readings. Changes during the delay restart the wait.
          default: 10
          selector:
            number:
              min: 0
              max: 120
              step: 1
              mode: box
              unit_of_measurement: seconds

variables:
  central: !input central_thermostat
  paired: !input paired_thermostat
  change_helper: !input automation_change_helper

  radiator_entities:
    - !input radiator_1
    - !input radiator_2
    - !input radiator_3
    - !input radiator_4
    - !input radiator_5
    - !input radiator_6
    - !input radiator_7
    - !input radiator_8
    - !input radiator_9
    - !input radiator_10

  room_sensors:
    - !input temperature_sensor_1
    - !input temperature_sensor_2
    - !input temperature_sensor_3
    - !input temperature_sensor_4
    - !input temperature_sensor_5
    - !input temperature_sensor_6
    - !input temperature_sensor_7
    - !input temperature_sensor_8
    - !input temperature_sensor_9
    - !input temperature_sensor_10

  margin: !input room_temperature_margin
  boost: !input central_temperature_boost
  maximum_target: !input central_maximum_target
  debounce: !input debounce_seconds

  selected_radiators: >-
    {{ radiator_entities
       | reject('equalto', '')
       | reject('equalto', none)
       | list }}

triggers:
  - trigger: homeassistant
    event: start
    id: startup

  - trigger: time_pattern
    minutes: "/5"
    id: periodic

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input central_thermostat
    id: central_climate_changed

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input paired_thermostat
    id: paired_climate_changed

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input radiator_1
    id: radiator_changed
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input temperature_sensor_1
    id: room_sensor_changed

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input radiator_2
    id: radiator_changed
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input temperature_sensor_2
    id: room_sensor_changed

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input radiator_3
    id: radiator_changed
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input temperature_sensor_3
    id: room_sensor_changed

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input radiator_4
    id: radiator_changed
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input temperature_sensor_4
    id: room_sensor_changed

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input radiator_5
    id: radiator_changed
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input temperature_sensor_5
    id: room_sensor_changed

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input radiator_6
    id: radiator_changed
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input temperature_sensor_6
    id: room_sensor_changed

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input radiator_7
    id: radiator_changed
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input temperature_sensor_7
    id: room_sensor_changed

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input radiator_8
    id: radiator_changed
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input temperature_sensor_8
    id: room_sensor_changed

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input radiator_9
    id: radiator_changed
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input temperature_sensor_9
    id: room_sensor_changed

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input radiator_10
    id: radiator_changed
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input temperature_sensor_10
    id: room_sensor_changed

conditions:
  - condition: template
    value_template: "{{ selected_radiators | length > 0 }}"

actions:
  - delay:
      seconds: "{{ debounce | int(10) }}"

  - variables:
      helper_was_on: "{{ is_state(change_helper, 'on') }}"
      sync_relevant_change: >-
        {% if trigger.id in ['central_climate_changed', 'paired_climate_changed'] %}
          {% set old = trigger.event.data.get('old_state') %}
          {% set new = trigger.event.data.get('new_state') %}
          {% if old is not none and new is not none %}
            {{ old.state != new.state
               or old.attributes.get('temperature')
                  != new.attributes.get('temperature') }}
          {% else %}
            false
          {% endif %}
        {% else %}
          false
        {% endif %}
      sync_source: >-
        {{ central if trigger.id == 'central_climate_changed' else paired }}
      sync_destination: >-
        {{ paired if trigger.id == 'central_climate_changed' else central }}

  - if:
      - condition: template
        value_template: "{{ helper_was_on | bool }}"
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: !input automation_change_helper

  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ sync_relevant_change | bool
                 and not (helper_was_on | bool)
                 and paired not in ['', none]
                 and states(sync_source) not in ['unknown', 'unavailable']
                 and states(sync_destination) not in ['unknown', 'unavailable'] }}
        sequence:
          - if:
              - condition: template
                value_template: >-
                  {% set source_mode = states(sync_source) %}
                  {% set destination_modes =
                       state_attr(sync_destination, 'hvac_modes') or [] %}
                  {% set source_target =
                       state_attr(sync_source, 'temperature') %}
                  {% set destination_target =
                       state_attr(sync_destination, 'temperature') %}
                  {{ source_mode in destination_modes
                     and is_number(source_target)
                     and (source_mode != states(sync_destination)
                          or not is_number(destination_target)
                          or ((source_target | float
                               - (destination_target | float)) | abs) > 0.05 }}
            then:
              - action: climate.set_temperature
                target:
                  entity_id: "{{ sync_destination }}"
                data:
                  hvac_mode: "{{ states(sync_source) }}"
                  temperature: "{{ state_attr(sync_source, 'temperature') | float }}"

          - if:
              - condition: template
                value_template: >-
                  {% set source_mode = states(sync_source) %}
                  {% set destination_modes =
                       state_attr(sync_destination, 'hvac_modes') or [] %}
                  {{ source_mode in destination_modes
                     and source_mode != states(sync_destination)
                     and not is_number(state_attr(sync_source, 'temperature')) }}
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: "{{ sync_destination }}"
                data:
                  hvac_mode: "{{ states(sync_source) }}"

          - if:
              - condition: template
                value_template: >-
                  {% set source_mode = states(sync_source) %}
                  {% set destination_modes =
                       state_attr(sync_destination, 'hvac_modes') or [] %}
                  {% set source_target =
                       state_attr(sync_source, 'temperature') %}
                  {% set destination_target =
                       state_attr(sync_destination, 'temperature') %}
                  {{ source_mode not in destination_modes
                     and is_number(source_target)
                     and (not is_number(destination_target)
                          or ((source_target | float
                               - (destination_target | float)) | abs) > 0.05 }}
            then:
              - action: climate.set_temperature
                target:
                  entity_id: "{{ sync_destination }}"
                data:
                  temperature: "{{ state_attr(sync_source, 'temperature') | float }}"

  - variables:
      rooms_valid: >-
        {% set ns = namespace(ok=true) %}
        {% for i in range(radiator_entities | length) %}
          {% set radiator = radiator_entities[i] %}
          {% if radiator not in ['', none] %}
            {% set mode = states(radiator) %}
            {% set target = state_attr(radiator, 'temperature') %}
            {% set sensor = room_sensors[i] %}
            {% if sensor not in ['', none] %}
              {% set measured = states(sensor) %}
            {% else %}
              {% set measured = state_attr(radiator, 'current_temperature') %}
            {% endif %}
            {% if mode in ['unknown', 'unavailable']
                  or not is_number(target)
                  or not is_number(measured) %}
              {% set ns.ok = false %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.ok }}

      room_heat_target: >-
        {% set ns = namespace(target=none) %}
        {% for i in range(radiator_entities | length) %}
          {% set radiator = radiator_entities[i] %}
          {% if radiator not in ['', none]
                and states(radiator) not in ['off', 'unknown', 'unavailable'] %}
            {% set requested = state_attr(radiator, 'temperature') %}
            {% set sensor = room_sensors[i] %}
            {% if sensor not in ['', none] %}
              {% set measured = states(sensor) %}
            {% else %}
              {% set measured = state_attr(radiator, 'current_temperature') %}
            {% endif %}
            {% if is_number(requested)
                  and is_number(measured)
                  and (measured | float)
                      < ((requested | float) - (margin | float)) %}
              {% if ns.target is none or (requested | float) > ns.target %}
                {% set ns.target = requested | float %}
              {% endif %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.target }}

      central_temperature: "{{ state_attr(central, 'current_temperature') }}"

  - variables:
      central_call_target: >-
        {% set current = central_temperature %}
        {% set step_attr = state_attr(central, 'target_temp_step') %}
        {% set device_max = state_attr(central, 'max_temp') %}
        {% set configured_max = maximum_target | float %}
        {% if is_number(device_max) %}
          {% set cap = [configured_max, (device_max | float)] | min %}
        {% else %}
          {% set cap = configured_max %}
        {% endif %}
        {% if is_number(step_attr) and (step_attr | float) > 0 %}
          {% set step = step_attr | float %}
        {% else %}
          {% set step = 0.1 %}
        {% endif %}
        {% if is_number(current) and is_number(room_heat_target) %}
          {% set desired =
               [room_heat_target | float,
                (current | float) + (boost | float)] | max %}
          {% set rounded_up =
               ((desired / step) | round(0, 'ceil')) * step %}
          {% set aligned_cap =
               ((cap / step) | round(0, 'floor')) * step %}
          {{ [rounded_up, aligned_cap] | min }}
        {% else %}
          {{ none }}
        {% endif %}

  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ rooms_valid | bool
                 and is_number(room_heat_target)
                 and is_number(central_temperature)
                 and is_number(central_call_target)
                 and (central_call_target | float)
                     > (central_temperature | float)
                 and states(central) not in ['unknown', 'unavailable']
                 and 'heat' in (state_attr(central, 'hvac_modes') or []) }}
        sequence:
          - if:
              - condition: template
                value_template: >-
                  {% set current_target = state_attr(central, 'temperature') %}
                  {{ states(central) != 'heat'
                     or not is_number(current_target)
                     or ((current_target | float
                          - (central_call_target | float)) | abs) > 0.05 }}
            then:
              - action: climate.set_temperature
                target:
                  entity_id: !input central_thermostat
                data:
                  hvac_mode: heat
                  temperature: "{{ central_call_target | float }}"

      - conditions:
          - condition: template
            value_template: >-
              {{ rooms_valid | bool
                 and not is_number(room_heat_target)
                 and states(central) not in ['unknown', 'unavailable']
                 and 'off' in (state_attr(central, 'hvac_modes') or [])
                 and states(central) != 'off' }}
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input central_thermostat
            data:
              hvac_mode: "off"

mode: restart
