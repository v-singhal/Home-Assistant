blueprint:
  name: Boiler demand from radiator thermostats
  description: >
    Controls a central boiler-connected climate thermostat from up to 10
    radiator climate entities. Optional room temperature sensors can replace
    the radiator entities' current_temperature readings.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    central_thermostat:
      name: Boiler-connected central thermostat
      description: Required climate entity that controls the boiler.
      selector:
        entity:
          domain: climate

    radiator_room_1:
      name: Radiator 1
      input:
        radiator_1:
          name: Radiator thermostat
          default: ""
          selector:
            entity:
              domain: climate
        temperature_sensor_1:
          name: Corresponding temperature sensor (optional)
          description: Leave blank to use this thermostat's current_temperature.
          default: ""
          selector:
            entity:
              domain: sensor

    radiator_room_2:
      name: Radiator 2
      input:
        radiator_2:
          name: Radiator thermostat
          default: ""
          selector:
            entity:
              domain: climate
        temperature_sensor_2:
          name: Corresponding temperature sensor (optional)
          description: Leave blank to use this thermostat's current_temperature.
          default: ""
          selector:
            entity:
              domain: sensor

    radiator_room_3:
      name: Radiator 3
      input:
        radiator_3:
          name: Radiator thermostat
          default: ""
          selector:
            entity:
              domain: climate
        temperature_sensor_3:
          name: Corresponding temperature sensor (optional)
          description: Leave blank to use this thermostat's current_temperature.
          default: ""
          selector:
            entity:
              domain: sensor

    radiator_room_4:
      name: Radiator 4
      input:
        radiator_4:
          name: Radiator thermostat
          default: ""
          selector:
            entity:
              domain: climate
        temperature_sensor_4:
          name: Corresponding temperature sensor (optional)
          description: Leave blank to use this thermostat's current_temperature.
          default: ""
          selector:
            entity:
              domain: sensor

    radiator_room_5:
      name: Radiator 5
      input:
        radiator_5:
          name: Radiator thermostat
          default: ""
          selector:
            entity:
              domain: climate
        temperature_sensor_5:
          name: Corresponding temperature sensor (optional)
          description: Leave blank to use this thermostat's current_temperature.
          default: ""
          selector:
            entity:
              domain: sensor

    radiator_room_6:
      name: Radiator 6
      input:
        radiator_6:
          name: Radiator thermostat
          default: ""
          selector:
            entity:
              domain: climate
        temperature_sensor_6:
          name: Corresponding temperature sensor (optional)
          description: Leave blank to use this thermostat's current_temperature.
          default: ""
          selector:
            entity:
              domain: sensor

    radiator_room_7:
      name: Radiator 7
      input:
        radiator_7:
          name: Radiator thermostat
          default: ""
          selector:
            entity:
              domain: climate
        temperature_sensor_7:
          name: Corresponding temperature sensor (optional)
          description: Leave blank to use this thermostat's current_temperature.
          default: ""
          selector:
            entity:
              domain: sensor

    radiator_room_8:
      name: Radiator 8
      input:
        radiator_8:
          name: Radiator thermostat
          default: ""
          selector:
            entity:
              domain: climate
        temperature_sensor_8:
          name: Corresponding temperature sensor (optional)
          description: Leave blank to use this thermostat's current_temperature.
          default: ""
          selector:
            entity:
              domain: sensor

    radiator_room_9:
      name: Radiator 9
      input:
        radiator_9:
          name: Radiator thermostat
          default: ""
          selector:
            entity:
              domain: climate
        temperature_sensor_9:
          name: Corresponding temperature sensor (optional)
          description: Leave blank to use this thermostat's current_temperature.
          default: ""
          selector:
            entity:
              domain: sensor

    radiator_room_10:
      name: Radiator 10
      input:
        radiator_10:
          name: Radiator thermostat
          default: ""
          selector:
            entity:
              domain: climate
        temperature_sensor_10:
          name: Corresponding temperature sensor (optional)
          description: Leave blank to use this thermostat's current_temperature.
          default: ""
          selector:
            entity:
              domain: sensor

    settings:
      name: Temperature settings
      input:
        room_temperature_margin:
          name: Room temperature margin
          description: >
            A room needs heat when its measured temperature is below its
            thermostat target minus this margin.
          default: 0.5
          selector:
            number:
              min: 0
              max: 10
              step: 0.1
              mode: box
              unit_of_measurement: "°"

        central_temperature_boost:
          name: Central thermostat boost
          description: Amount added to the central thermostat's measured temperature.
          default: 2
          selector:
            number:
              min: 0.1
              max: 20
              step: 0.1
              mode: box
              unit_of_measurement: "°"

        central_maximum_target:
          name: Central thermostat maximum target
          description: >
            Upper cap for the target sent to the central thermostat. Set this
            within that thermostat's supported temperature range.
          default: 25
          selector:
            number:
              min: -50
              max: 100
              step: 0.1
              mode: box
              unit_of_measurement: "°"

variables:
  central: !input central_thermostat

  radiator_entities:
    - !input radiator_1
    - !input radiator_2
    - !input radiator_3
    - !input radiator_4
    - !input radiator_5
    - !input radiator_6
    - !input radiator_7
    - !input radiator_8
    - !input radiator_9
    - !input radiator_10

  room_sensors:
    - !input temperature_sensor_1
    - !input temperature_sensor_2
    - !input temperature_sensor_3
    - !input temperature_sensor_4
    - !input temperature_sensor_5
    - !input temperature_sensor_6
    - !input temperature_sensor_7
    - !input temperature_sensor_8
    - !input temperature_sensor_9
    - !input temperature_sensor_10

  margin: !input room_temperature_margin
  boost: !input central_temperature_boost
  maximum_target: !input central_maximum_target

  selected_radiators: >-
    {{ radiator_entities
       | reject('equalto', '')
       | reject('equalto', none)
       | list }}

  rooms_valid: >-
    {% set ns = namespace(ok=true) %}
    {% for i in range(radiator_entities | length) %}
      {% set radiator = radiator_entities[i] %}
      {% if radiator not in ['', none] %}
        {% set mode = states(radiator) %}
        {% if mode in ['unknown', 'unavailable'] %}
          {% set ns.ok = false %}
        {% elif mode != 'off' %}
          {% set target = state_attr(radiator, 'temperature') %}
          {% set sensor = room_sensors[i] %}
          {% if sensor not in ['', none] %}
            {% set measured = states(sensor) %}
          {% else %}
            {% set measured = state_attr(radiator, 'current_temperature') %}
          {% endif %}
          {% if not is_number(target) or not is_number(measured) %}
            {% set ns.ok = false %}
          {% endif %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ ns.ok }}

  room_needs_heat: >-
    {% set ns = namespace(needs_heat=false) %}
    {% for i in range(radiator_entities | length) %}
      {% set radiator = radiator_entities[i] %}
      {% if radiator not in ['', none] and states(radiator) not in ['off', 'unknown', 'unavailable'] %}
        {% set target = state_attr(radiator, 'temperature') %}
        {% set sensor = room_sensors[i] %}
        {% if sensor not in ['', none] %}
          {% set measured = states(sensor) %}
        {% else %}
          {% set measured = state_attr(radiator, 'current_temperature') %}
        {% endif %}
        {% if is_number(target) and is_number(measured)
              and (measured | float) < ((target | float) - (margin | float)) %}
          {% set ns.needs_heat = true %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ ns.needs_heat }}

  central_temperature: "{{ state_attr(central, 'current_temperature') }}"
  desired_central_target: >-
    {{ [((central_temperature | float(0) + (boost | float)) | round(1)),
        (maximum_target | float)] | min }}

triggers:
  - trigger: homeassistant
    event: start
    id: startup

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input central_thermostat
    id: central_change

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input radiator_1
    id: radiator_1_change
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input temperature_sensor_1
    id: sensor_1_change

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input radiator_2
    id: radiator_2_change
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input temperature_sensor_2
    id: sensor_2_change

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input radiator_3
    id: radiator_3_change
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input temperature_sensor_3
    id: sensor_3_change

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input radiator_4
    id: radiator_4_change
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input temperature_sensor_4
    id: sensor_4_change

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input radiator_5
    id: radiator_5_change
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input temperature_sensor_5
    id: sensor_5_change

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input radiator_6
    id: radiator_6_change
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input temperature_sensor_6
    id: sensor_6_change

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input radiator_7
    id: radiator_7_change
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input temperature_sensor_7
    id: sensor_7_change

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input radiator_8
    id: radiator_8_change
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input temperature_sensor_8
    id: sensor_8_change

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input radiator_9
    id: radiator_9_change
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input temperature_sensor_9
    id: sensor_9_change

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input radiator_10
    id: radiator_10_change
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input temperature_sensor_10
    id: sensor_10_change

conditions:
  - condition: template
    value_template: "{{ selected_radiators | count > 0 }}"

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ (rooms_valid | bool)
                 and (room_needs_heat | bool)
                 and states(central) not in ['unknown', 'unavailable']
                 and is_number(central_temperature)
                 and 'heat' in (state_attr(central, 'hvac_modes') or []) }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ states(central) != 'heat' }}"
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: "{{ central }}"
                data:
                  hvac_mode: heat

          - if:
              - condition: template
                value_template: >-
                  {{ not is_number(state_attr(central, 'temperature'))
                     or ((state_attr(central, 'temperature') | float)
                         - (desired_central_target | float)) | abs > 0.05 }}
            then:
              - action: climate.set_temperature
                target:
                  entity_id: "{{ central }}"
                data:
                  temperature: "{{ desired_central_target }}"

      - conditions:
          - condition: template
            value_template: >-
              {{ (rooms_valid | bool)
                 and not (room_needs_heat | bool)
                 and states(central) not in ['unknown', 'unavailable']
                 and 'off' in (state_attr(central, 'hvac_modes') or []) }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ states(central) != 'off' }}"
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: "{{ central }}"
                data:
                  hvac_mode: "off"

mode: restart
