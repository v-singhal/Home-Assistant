blueprint:
  name: 🥵🥶 Boiler heat demand from radiator thermostats
  description: >
    Uses selected radiator climate entities as room-demand inputs and a
    boiler-connected climate thermostat to call for heat. Blank radiator
    inputs are ignored. At least one radiator must be selected. If any
    selected radiator is unavailable or has invalid temperature attributes,
    the central thermostat is left unchanged.
  domain: automation
  input:
    boiler_thermostat:
      name: Boiler-connected central thermostat
      description: Climate entity that controls the boiler.
      selector:
        entity:
          filter:
            - domain: climate

    room_thermostat_1:
      name: Radiator thermostat 1 (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: climate
    room_thermostat_2:
      name: Radiator thermostat 2 (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: climate
    room_thermostat_3:
      name: Radiator thermostat 3 (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: climate
    room_thermostat_4:
      name: Radiator thermostat 4 (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: climate
    room_thermostat_5:
      name: Radiator thermostat 5 (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: climate
    room_thermostat_6:
      name: Radiator thermostat 6 (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: climate
    room_thermostat_7:
      name: Radiator thermostat 7 (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: climate
    room_thermostat_8:
      name: Radiator thermostat 8 (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: climate
    room_thermostat_9:
      name: Radiator thermostat 9 (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: climate
    room_thermostat_10:
      name: Radiator thermostat 10 (optional)
      default: ""
      selector:
        entity:
          filter:
            - domain: climate

    room_margin:
      name: Room temperature margin
      description: >
        A room requests heat when its measured temperature is below its target
        minus this margin. Values use Home Assistant's temperature unit.
      default: 0.4
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          mode: box

    call_boost:
      name: Central thermostat boost
      description: >
        Add this amount to the central thermostat's measured temperature when
        requesting heat. Values use Home Assistant's temperature unit.
      default: 2
      selector:
        number:
          min: 0.1
          max: 20
          step: 0.1
          mode: box

    max_call_temperature:
      name: Maximum central target
      description: >
        Upper cap for the central target. Set it within the central
        thermostat's supported range, and above its measured temperature
        whenever heat may be requested. Values use Home Assistant's
        temperature unit.
      default: 25
      selector:
        number:
          min: 1
          max: 100
          step: 0.1
          mode: box

triggers:
  - trigger: homeassistant
    event: start

  - trigger: state
    entity_id: !input boiler_thermostat
    attribute: current_temperature

  - trigger: time_pattern
    minutes: "/1"

variables:
  boiler_entity: !input boiler_thermostat
  room_margin_value: !input room_margin
  call_boost_value: !input call_boost
  max_call_temperature_value: !input max_call_temperature

  room_entity_inputs:
    - !input room_thermostat_1
    - !input room_thermostat_2
    - !input room_thermostat_3
    - !input room_thermostat_4
    - !input room_thermostat_5
    - !input room_thermostat_6
    - !input room_thermostat_7
    - !input room_thermostat_8
    - !input room_thermostat_9
    - !input room_thermostat_10

  room_entities: >-
    {{ room_entity_inputs
       | reject('equalto', '')
       | reject('equalto', none)
       | list }}

  room_readings_valid: >-
    {% set ns = namespace(valid=true) %}
    {% for entity_id in room_entities %}
      {% set entity_state = states(entity_id) %}
      {% if entity_state in ['unknown', 'unavailable'] %}
        {% set ns.valid = false %}
      {% elif not is_number(state_attr(entity_id, 'current_temperature'))
            or not is_number(state_attr(entity_id, 'temperature')) %}
        {% set ns.valid = false %}
      {% endif %}
    {% endfor %}
    {{ ns.valid }}

  room_needs_heat: >-
    {% set ns = namespace(demand=false) %}
    {% for entity_id in room_entities %}
      {% set entity_state = states(entity_id) %}
      {% set current = state_attr(entity_id, 'current_temperature') %}
      {% set target = state_attr(entity_id, 'temperature') %}
      {% if entity_state not in ['off', 'unknown', 'unavailable']
            and is_number(current)
            and is_number(target)
            and (current | float)
                < ((target | float) - (room_margin_value | float)) %}
        {% set ns.demand = true %}
      {% endif %}
    {% endfor %}
    {{ ns.demand }}

  central_current_temperature: >-
    {{ state_attr(boiler_entity, 'current_temperature') }}

  central_target_step: >-
    {% set reported_step = state_attr(boiler_entity, 'target_temp_step') %}
    {% if is_number(reported_step) and (reported_step | float) > 0 %}
      {{ reported_step | float }}
    {% else %}
      0.1
    {% endif %}

  central_effective_max: >-
    {% set configured_max = max_call_temperature_value | float %}
    {% set device_max = state_attr(boiler_entity, 'max_temp') %}
    {% if is_number(device_max) %}
      {{ [configured_max, (device_max | float)] | min }}
    {% else %}
      {{ configured_max }}
    {% endif %}

  boiler_call_target: >-
    {% set current = central_current_temperature %}
    {% set step = central_target_step | float %}
    {% set cap = central_effective_max | float %}
    {% if is_number(current) and step > 0 %}
      {% set desired = (current | float) + (call_boost_value | float) %}
      {% set rounded_up = ((desired / step) | round(0, 'ceil')) * step %}
      {% set aligned_cap = ((cap / step) | round(0, 'floor')) * step %}
      {{ [rounded_up, aligned_cap] | min }}
    {% else %}
      0
    {% endif %}

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ room_entities | count > 0
                 and room_readings_valid
                 and room_needs_heat
                 and states(boiler_entity) not in ['unknown', 'unavailable']
                 and 'heat' in (state_attr(boiler_entity, 'hvac_modes') or [])
                 and is_number(central_current_temperature)
                 and (boiler_call_target | float)
                     > (central_current_temperature | float) }}
        sequence:
          - if:
              - condition: template
                value_template: >-
                  {% set current_target = state_attr(boiler_entity, 'temperature') %}
                  {{ states(boiler_entity) != 'heat'
                     or not is_number(current_target)
                     or ((current_target | float
                          - (boiler_call_target | float)) | abs) > 0.05 }}
            then:
              - action: climate.set_temperature
                target:
                  entity_id: !input boiler_thermostat
                data:
                  hvac_mode: heat
                  temperature: "{{ boiler_call_target | float }}"

      - conditions:
          - condition: template
            value_template: >-
              {{ room_entities | count > 0
                 and room_readings_valid
                 and not room_needs_heat
                 and states(boiler_entity) not in ['unknown', 'unavailable']
                 and 'off' in (state_attr(boiler_entity, 'hvac_modes') or [])
                 and states(boiler_entity) != 'off' }}
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input boiler_thermostat
            data:
              hvac_mode: "off"

mode: restart
