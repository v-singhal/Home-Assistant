blueprint:
  name: "🥶 Boiler Demand Controller via Radiator Thermostats"
  description: >
    Uses up to 10 radiator climate entities to decide whether to call for heat
    through a central climate thermostat. An optional temperature sensor can
    replace each radiator thermostat's current_temperature reading.
  domain: automation

  input:
    central_thermostat:
      name: Boiler-connected central thermostat
      description: Required climate entity that controls the boiler.
      selector:
        entity:
          domain: climate

    radiator_1:
      name: Radiator thermostat 1
      description: Optional. Leave blank to ignore.
      default: ""
      selector:
        entity:
          domain: climate
    radiator_2:
      name: Radiator thermostat 2
      description: Optional. Leave blank to ignore.
      default: ""
      selector:
        entity:
          domain: climate
    radiator_3:
      name: Radiator thermostat 3
      description: Optional. Leave blank to ignore.
      default: ""
      selector:
        entity:
          domain: climate
    radiator_4:
      name: Radiator thermostat 4
      description: Optional. Leave blank to ignore.
      default: ""
      selector:
        entity:
          domain: climate
    radiator_5:
      name: Radiator thermostat 5
      description: Optional. Leave blank to ignore.
      default: ""
      selector:
        entity:
          domain: climate
    radiator_6:
      name: Radiator thermostat 6
      description: Optional. Leave blank to ignore.
      default: ""
      selector:
        entity:
          domain: climate
    radiator_7:
      name: Radiator thermostat 7
      description: Optional. Leave blank to ignore.
      default: ""
      selector:
        entity:
          domain: climate
    radiator_8:
      name: Radiator thermostat 8
      description: Optional. Leave blank to ignore.
      default: ""
      selector:
        entity:
          domain: climate
    radiator_9:
      name: Radiator thermostat 9
      description: Optional. Leave blank to ignore.
      default: ""
      selector:
        entity:
          domain: climate
    radiator_10:
      name: Radiator thermostat 10
      description: Optional. Leave blank to ignore.
      default: ""
      selector:
        entity:
          domain: climate

    temperature_sensor_1:
      name: Temperature sensor for radiator 1
      description: Optional. If blank, radiator 1's current_temperature is used.
      default: ""
      selector:
        entity:
          domain: sensor
    temperature_sensor_2:
      name: Temperature sensor for radiator 2
      description: Optional. If blank, radiator 2's current_temperature is used.
      default: ""
      selector:
        entity:
          domain: sensor
    temperature_sensor_3:
      name: Temperature sensor for radiator 3
      description: Optional. If blank, radiator 3's current_temperature is used.
      default: ""
      selector:
        entity:
          domain: sensor
    temperature_sensor_4:
      name: Temperature sensor for radiator 4
      description: Optional. If blank, radiator 4's current_temperature is used.
      default: ""
      selector:
        entity:
          domain: sensor
    temperature_sensor_5:
      name: Temperature sensor for radiator 5
      description: Optional. If blank, radiator 5's current_temperature is used.
      default: ""
      selector:
        entity:
          domain: sensor
    temperature_sensor_6:
      name: Temperature sensor for radiator 6
      description: Optional. If blank, radiator 6's current_temperature is used.
      default: ""
      selector:
        entity:
          domain: sensor
    temperature_sensor_7:
      name: Temperature sensor for radiator 7
      description: Optional. If blank, radiator 7's current_temperature is used.
      default: ""
      selector:
        entity:
          domain: sensor
    temperature_sensor_8:
      name: Temperature sensor for radiator 8
      description: Optional. If blank, radiator 8's current_temperature is used.
      default: ""
      selector:
        entity:
          domain: sensor
    temperature_sensor_9:
      name: Temperature sensor for radiator 9
      description: Optional. If blank, radiator 9's current_temperature is used.
      default: ""
      selector:
        entity:
          domain: sensor
    temperature_sensor_10:
      name: Temperature sensor for radiator 10
      description: Optional. If blank, radiator 10's current_temperature is used.
      default: ""
      selector:
        entity:
          domain: sensor

    room_temperature_margin:
      name: Room temperature margin
      description: A room calls for heat below target temperature minus this margin.
      default: 0.5
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          mode: box
          unit_of_measurement: "°"

    central_temperature_boost:
      name: Central thermostat boost
      description: Adds this amount to the central thermostat's measured temperature.
      default: 2
      selector:
        number:
          min: 0.1
          max: 20
          step: 0.1
          mode: box
          unit_of_measurement: "°"

    central_maximum_target:
      name: Central thermostat maximum target
      description: >
        Upper cap for the target sent to the central thermostat. Set this
        within that thermostat's supported temperature range.
      default: 25
      selector:
        number:
          min: -50
          max: 100
          step: 0.1
          mode: box
          unit_of_measurement: "°"

variables:
  central: !input central_thermostat

  radiator_entities:
    - !input radiator_1
    - !input radiator_2
    - !input radiator_3
    - !input radiator_4
    - !input radiator_5
    - !input radiator_6
    - !input radiator_7
    - !input radiator_8
    - !input radiator_9
    - !input radiator_10

  room_sensors:
    - !input temperature_sensor_1
    - !input temperature_sensor_2
    - !input temperature_sensor_3
    - !input temperature_sensor_4
    - !input temperature_sensor_5
    - !input temperature_sensor_6
    - !input temperature_sensor_7
    - !input temperature_sensor_8
    - !input temperature_sensor_9
    - !input temperature_sensor_10

  margin: !input room_temperature_margin
  boost: !input central_temperature_boost
  maximum_target: !input central_maximum_target

  selected_radiators: >-
    {{ radiator_entities
       | reject('equalto', '')
       | reject('equalto', none)
       | list }}

  selected_room_sensors: >-
    {{ room_sensors
       | reject('equalto', '')
       | reject('equalto', none)
       | list }}

  watched_entities: >-
    {{ [central] + selected_radiators + selected_room_sensors }}

  rooms_valid: >-
    {% set ns = namespace(ok=true) %}
    {% for i in range(radiator_entities | length) %}
      {% set radiator = radiator_entities[i] %}
      {% if radiator not in ['', none] %}
        {% set mode = states(radiator) %}
        {% if mode in ['unknown', 'unavailable'] %}
          {% set ns.ok = false %}
        {% elif mode != 'off' %}
          {% set target = state_attr(radiator, 'temperature') %}
          {% set sensor = room_sensors[i] %}
          {% if sensor not in ['', none] %}
            {% set measured = states(sensor) %}
          {% else %}
            {% set measured = state_attr(radiator, 'current_temperature') %}
          {% endif %}
          {% if not is_number(target) or not is_number(measured) %}
            {% set ns.ok = false %}
          {% endif %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ ns.ok }}

  room_needs_heat: >-
    {% set ns = namespace(needs_heat=false) %}
    {% for i in range(radiator_entities | length) %}
      {% set radiator = radiator_entities[i] %}
      {% if radiator not in ['', none] and states(radiator) not in ['off', 'unknown', 'unavailable'] %}
        {% set target = state_attr(radiator, 'temperature') %}
        {% set sensor = room_sensors[i] %}
        {% if sensor not in ['', none] %}
          {% set measured = states(sensor) %}
        {% else %}
          {% set measured = state_attr(radiator, 'current_temperature') %}
        {% endif %}
        {% if is_number(target) and is_number(measured)
              and (measured | float) < ((target | float) - (margin | float)) %}
          {% set ns.needs_heat = true %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ ns.needs_heat }}

  central_temperature: "{{ state_attr(central, 'current_temperature') }}"
  central_modes: "{{ state_attr(central, 'hvac_modes') or [] }}"
  central_available: "{{ states(central) not in ['unknown', 'unavailable'] }}"
  central_can_heat: "{{ 'heat' in central_modes }}"
  central_can_turn_off: "{{ 'off' in central_modes }}"
  desired_central_target: >-
    {{ [((central_temperature | float(0) + (boost | float)) | round(1)),
        (maximum_target | float)] | min }}

triggers:
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: event
    event_type: state_changed
    id: entity_change

conditions:
  - condition: template
    value_template: "{{ selected_radiators | count > 0 }}"
  - condition: template
    value_template: >-
      {{ trigger.id == 'startup'
         or trigger.event.data.entity_id in watched_entities }}

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ rooms_valid
                 and room_needs_heat
                 and central_available
                 and is_number(central_temperature)
                 and central_can_heat }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ states(central) != 'heat' }}"
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: "{{ central }}"
                data:
                  hvac_mode: heat

          - if:
              - condition: template
                value_template: >-
                  {{ not is_number(state_attr(central, 'temperature'))
                     or ((state_attr(central, 'temperature') | float)
                         - (desired_central_target | float)) | abs > 0.05 }}
            then:
              - action: climate.set_temperature
                target:
                  entity_id: "{{ central }}"
                data:
                  temperature: "{{ desired_central_target }}"

      - conditions:
          - condition: template
            value_template: >-
              {{ rooms_valid
                 and not room_needs_heat
                 and central_available
                 and central_can_turn_off }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ states(central) != 'off' }}"
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: "{{ central }}"
                data:
                  hvac_mode: "off"

mode: single
