blueprint:
  name: "🗓️ Calendar reminders"
  description: >
    Send notifications at up to five configurable offsets from calendar event
    starts or ends. Optional slots can be disabled. Match comma-separated
    keywords against event titles and descriptions.
  domain: automation
  homeassistant:
      min_version: "2024.6.0"
  input:
    calendar:
      name: Calendar
      description: Select the calendar to monitor.
      selector:
        entity:
          filter:
            - domain: calendar

    notify_targets:
      name: Devices to notify
      description: Select one or more notification entities.
      selector:
        entity:
          filter:
            - domain: notify
          multiple: true

    keywords:
      name: Keywords
      description: >
        Comma-separated terms matched against the event title or description.
        Leave blank to match every event. Matching is case-insensitive.
      default: ""
      selector:
        text:

    reminder_1:
      name: Reminder 1 — always active
      description: This is the required reminder slot.
      icon: mdi:bell
      collapsed: true
      input:
        slot1_anchor:
          name: Anchor
          default: start
          selector:
            select:
              options:
                - label: Event start
                  value: start
                - label: Event end
                  value: end
        slot1_offset:
          name: Offset
          description: >
            Duration from the anchor. Use the sign control for before or after.
            Zero fires at the anchor.
          default:
            days: 0
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:
              enable_day: true
              allow_negative: true
        slot1_title:
          name: Notification title
          default: "Calendar reminder"
          selector:
            text:
        slot1_message:
          name: Notification message
          default: "{{ trigger.calendar_event.summary }}"
          selector:
            text:
              multiline: true

    reminder_2:
      name: Reminder 2 — optional
      icon: mdi:bell-outline
      collapsed: true
      input:
        slot2_enabled:
          name: Enabled
          default: false
          selector:
            boolean:
        slot2_anchor:
          name: Anchor
          default: start
          selector:
            select:
              options:
                - label: Event start
                  value: start
                - label: Event end
                  value: end
        slot2_offset:
          name: Offset
          description: >
            Duration from the anchor. Use the sign control for before or after.
            Zero fires at the anchor.
          default:
            days: 0
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:
              enable_day: true
              allow_negative: true
        slot2_title:
          name: Notification title
          default: "Calendar reminder"
          selector:
            text:
        slot2_message:
          name: Notification message
          default: "{{ trigger.calendar_event.summary }}"
          selector:
            text:
              multiline: true

    reminder_3:
      name: Reminder 3 — optional
      icon: mdi:bell-outline
      collapsed: true
      input:
        slot3_enabled:
          name: Enabled
          default: false
          selector:
            boolean:
        slot3_anchor:
          name: Anchor
          default: start
          selector:
            select:
              options:
                - label: Event start
                  value: start
                - label: Event end
                  value: end
        slot3_offset:
          name: Offset
          description: >
            Duration from the anchor. Use the sign control for before or after.
            Zero fires at the anchor.
          default:
            days: 0
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:
              enable_day: true
              allow_negative: true
        slot3_title:
          name: Notification title
          default: "Calendar reminder"
          selector:
            text:
        slot3_message:
          name: Notification message
          default: "{{ trigger.calendar_event.summary }}"
          selector:
            text:
              multiline: true

    reminder_4:
      name: Reminder 4 — optional
      icon: mdi:bell-outline
      collapsed: true
      input:
        slot4_enabled:
          name: Enabled
          default: false
          selector:
            boolean:
        slot4_anchor:
          name: Anchor
          default: start
          selector:
            select:
              options:
                - label: Event start
                  value: start
                - label: Event end
                  value: end
        slot4_offset:
          name: Offset
          description: >
            Duration from the anchor. Use the sign control for before or after.
            Zero fires at the anchor.
          default:
            days: 0
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:
              enable_day: true
              allow_negative: true
        slot4_title:
          name: Notification title
          default: "Calendar reminder"
          selector:
            text:
        slot4_message:
          name: Notification message
          default: "{{ trigger.calendar_event.summary }}"
          selector:
            text:
              multiline: true

    reminder_5:
      name: Reminder 5 — optional
      icon: mdi:bell-outline
      collapsed: true
      input:
        slot5_enabled:
          name: Enabled
          default: false
          selector:
            boolean:
        slot5_anchor:
          name: Anchor
          default: start
          selector:
            select:
              options:
                - label: Event start
                  value: start
                - label: Event end
                  value: end
        slot5_offset:
          name: Offset
          description: >
            Duration from the anchor. Use the sign control for before or after.
            Zero fires at the anchor.
          default:
            days: 0
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:
              enable_day: true
              allow_negative: true
        slot5_title:
          name: Notification title
          default: "Calendar reminder"
          selector:
            text:
        slot5_message:
          name: Notification message
          default: "{{ trigger.calendar_event.summary }}"
          selector:
            text:
              multiline: true

variables:
  keywords: !input keywords
  slot2_enabled: !input slot2_enabled
  slot3_enabled: !input slot3_enabled
  slot4_enabled: !input slot4_enabled
  slot5_enabled: !input slot5_enabled

triggers:
  - trigger: calendar
    entity_id: !input calendar
    event: !input slot1_anchor
    offset: !input slot1_offset
    id: reminder_1

  - trigger: calendar
    enabled: !input slot2_enabled
    entity_id: !input calendar
    event: !input slot2_anchor
    offset: !input slot2_offset
    id: reminder_2

  - trigger: calendar
    enabled: !input slot3_enabled
    entity_id: !input calendar
    event: !input slot3_anchor
    offset: !input slot3_offset
    id: reminder_3

  - trigger: calendar
    enabled: !input slot4_enabled
    entity_id: !input calendar
    event: !input slot4_anchor
    offset: !input slot4_offset
    id: reminder_4

  - trigger: calendar
    enabled: !input slot5_enabled
    entity_id: !input calendar
    event: !input slot5_anchor
    offset: !input slot5_offset
    id: reminder_5

conditions:
  - condition: template
    value_template: >
      {% set summary = trigger.calendar_event.summary | default('', true) %}
      {% set description = trigger.calendar_event.description | default('', true) %}
      {% set haystack = (summary ~ ' ' ~ description) | lower %}
      {% set ns = namespace(found=false) %}
      {% for item in keywords.split(',') %}
        {% set keyword = item | trim | lower %}
        {% if keyword and keyword in haystack %}
          {% set ns.found = true %}
        {% endif %}
      {% endfor %}
      {{ ns.found if keywords | trim else true }}

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: reminder_1
        sequence:
          - action: notify.send_message
            target:
              entity_id: !input notify_targets
            data:
              title: !input slot1_title
              message: !input slot1_message

      - conditions:
          - condition: trigger
            id: reminder_2
        sequence:
          - action: notify.send_message
            target:
              entity_id: !input notify_targets
            data:
              title: !input slot2_title
              message: !input slot2_message

      - conditions:
          - condition: trigger
            id: reminder_3
        sequence:
          - action: notify.send_message
            target:
              entity_id: !input notify_targets
            data:
              title: !input slot3_title
              message: !input slot3_message

      - conditions:
          - condition: trigger
            id: reminder_4
        sequence:
          - action: notify.send_message
            target:
              entity_id: !input notify_targets
            data:
              title: !input slot4_title
              message: !input slot4_message

      - conditions:
          - condition: trigger
            id: reminder_5
        sequence:
          - action: notify.send_message
            target:
              entity_id: !input notify_targets
            data:
              title: !input slot5_title
              message: !input slot5_message

mode: queued
max: 10
