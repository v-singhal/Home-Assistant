blueprint:
  name: 🌡️ Occupancy-based thermostat temperatures
  description: >
    Set the target temperature when occupancy or presence is detected, and
    the minimum temperature when the area becomes unoccupied. Each action
    has its own delay.
  domain: automation

  input:
    presence_sensor:
      name: Presence / occupancy sensor
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: occupancy
            - domain: binary_sensor
              device_class: presence

    thermostat:
      name: Thermostat
      selector:
        entity:
          domain: climate

    turn_on_delay:
      name: Delay after occupancy is detected
      default:
        hours: 0
        minutes: 0
        seconds: 0
      selector:
        duration:

    turn_off_delay:
      name: Delay after the area becomes unoccupied
      default:
        hours: 0
        minutes: 5
        seconds: 0
      selector:
        duration:

    target_temperature:
      name: Target temperature when occupied
      selector:
        number:
          min: -50
          max: 100
          step: 0.5
          mode: box

    minimum_temperature:
      name: Minimum temperature when unoccupied
      selector:
        number:
          min: -50
          max: 100
          step: 0.5
          mode: box

trigger:
  - platform: state
    entity_id: !input presence_sensor
    to: "on"
    id: occupied

  - platform: state
    entity_id: !input presence_sensor
    to: "off"
    id: unoccupied

action:
  - choose:
      - conditions:
          - condition: trigger
            id: occupied
        sequence:
          - delay: !input turn_on_delay
          - condition: state
            entity_id: !input presence_sensor
            state: "on"
          - service: climate.set_temperature
            target:
              entity_id: !input thermostat
            data:
              temperature: !input target_temperature

      - conditions:
          - condition: trigger
            id: unoccupied
        sequence:
          - delay: !input turn_off_delay
          - condition: state
            entity_id: !input presence_sensor
            state: "off"
          - service: climate.set_temperature
            target:
              entity_id: !input thermostat
            data:
              temperature: !input minimum_temperature

mode: restart
