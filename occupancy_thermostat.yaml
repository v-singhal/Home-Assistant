blueprint:
  name: "🥶🌡️ [Thermostat] Occupancy-Based Thermostat Cycle"
  description: >
    Controls a thermostat or TRV based on occupancy. With an external room
    temperature sensor, increases the TRV setpoint in 0.5°C / 0.9°F steps
    when the TRV's measured temperature catches up, until the room reaches
    its occupied target. Without an external sensor, uses the TRV's own
    measured temperature. Setpoints are capped at 25°C or the device's
    max_temp, whichever is lower.
  domain: automation
  input:
    occupancy_sensor:
      name: Occupancy / presence sensor
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: occupancy
            - domain: binary_sensor
              device_class: presence

    thermostat:
      name: Thermostat or TRV
      selector:
        entity:
          filter:
            - domain: climate

    room_temperature_sensor:
      name: External room temperature sensor (optional)
      default: null
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature

    occupied_delay:
      name: Delay before starting when occupied
      default: "00:00:00"
      selector:
        duration: {}

    unoccupied_delay:
      name: Delay before turning HVAC off when unoccupied
      default: "00:05:00"
      selector:
        duration: {}

    occupied_temperature_c:
      name: Occupied target temperature
      default: 20
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
          mode: box

    secondary_temperature_c:
      name: Unoccupied / secondary target temperature
      default: 16
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
          mode: box

    occupied_hvac_mode:
      name: HVAC mode when occupied
      default: heat
      selector:
        select:
          options:
            - heat
            - heat_cool
          mode: dropdown

    completion_helper:
      name: Completion boolean helper (optional)
      description: Turned on after setup, setpoint changes, and HVAC-off actions.
      default: null
      selector:
        entity:
          filter:
            - domain: input_boolean

    heating_started_actions:
      name: Actions when occupied heating starts
      default: []
      selector:
        action: {}

    heating_stopped_actions:
      name: Actions when heating stops or occupancy clears
      default: []
      selector:
        action: {}

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input occupancy_sensor
    to: "on"
    id: occupied

  - platform: state
    entity_id: !input occupancy_sensor
    to: "off"
    id: unoccupied

  - platform: homeassistant
    event: start
    id: startup

variables:
  occupancy_entity: !input occupancy_sensor
  thermostat_entity: !input thermostat
  room_sensor_entity: !input room_temperature_sensor
  completion_entity: !input completion_helper
  occupied_temp_input_c: !input occupied_temperature_c
  secondary_temp_input_c: !input secondary_temperature_c

  climate_unit: "{{ state_attr(thermostat_entity, 'temperature_unit') or '°C' }}"
  is_fahrenheit: "{{ climate_unit in ['°F', 'F'] }}"

  device_ceiling: >-
    {% set ceiling = 77 if is_fahrenheit else 25 %}
    {% set device_max = state_attr(thermostat_entity, 'max_temp') | float(ceiling) %}
    {{ [ceiling, device_max] | min }}

  occupied_target: >-
    {% set c = occupied_temp_input_c | float %}
    {% set converted = (c * 9 / 5 + 32) if is_fahrenheit else c %}
    {{ [converted, device_ceiling | float] | min }}

  secondary_target: >-
    {% set c = secondary_temp_input_c | float %}
    {% set converted = (c * 9 / 5 + 32) if is_fahrenheit else c %}
    {{ [converted, device_ceiling | float] | min }}

  trv_temperature: >-
    {{ state_attr(thermostat_entity, 'current_temperature') | float(-999) }}

  room_temperature: >-
    {% if room_sensor_entity is none or room_sensor_entity == '' %}
      -999
    {% else %}
      {% set value = states(room_sensor_entity) | float(-999) %}
      {% set unit = state_attr(room_sensor_entity, 'unit_of_measurement') %}
      {% if is_fahrenheit and unit in ['°C', 'C'] %}
        {{ value * 9 / 5 + 32 }}
      {% elif not is_fahrenheit and unit in ['°F', 'F'] %}
        {{ (value - 32) * 5 / 9 }}
      {% else %}
        {{ value }}
      {% endif %}
    {% endif %}

  step_size: "{{ 0.9 if is_fahrenheit else 0.5 }}"
  rounding_tolerance: "{{ 0.45 if is_fahrenheit else 0.25 }}"

action:
  - choose:
      # Occupied: wait, set the occupied mode and initial target, then control.
      - conditions:
          - condition: template
            value_template: "{{ states(occupancy_entity) == 'on' }}"
        sequence:
          - delay: !input occupied_delay
          - condition: template
            value_template: "{{ states(occupancy_entity) == 'on' }}"

          - action: climate.set_hvac_mode
            target:
              entity_id: !input thermostat
            data:
              hvac_mode: !input occupied_hvac_mode

          - variables:
              active_setpoint: "{{ occupied_target | float }}"

          - action: climate.set_temperature
            target:
              entity_id: !input thermostat
            data:
              temperature: "{{ active_setpoint }}"

          - sequence: !input heating_started_actions

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ completion_entity is not none and completion_entity != '' }}"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: !input completion_helper

          - repeat:
              while:
                - condition: template
                  value_template: "{{ true }}"
              sequence:
                # Wait for occupancy to clear, the room to reach target, or
                # the TRV temperature to catch the currently active setpoint.
                - wait_template: >-
                    {% set room_used = room_sensor_entity is not none
                       and room_sensor_entity != '' %}
                    {{
                      states(occupancy_entity) != 'on'
                      or (
                        room_used
                        and room_temperature | float(-999) >= occupied_target | float
                      )
                      or (
                        not room_used
                        and trv_temperature | float(-999) >= occupied_target | float
                      )
                      or (
                        room_used
                        and trv_temperature | float(-999)
                          >= active_setpoint | float - rounding_tolerance | float
                      )
                    }}

                - choose:
                    # Occupancy cleared: delay, recheck, then set secondary
                    # target and turn HVAC off.
                    - conditions:
                        - condition: template
                          value_template: "{{ states(occupancy_entity) != 'on' }}"
                      sequence:
                        - delay: !input unoccupied_delay
                        - condition: template
                          value_template: "{{ states(occupancy_entity) != 'on' }}"

                        - action: climate.set_temperature
                          target:
                            entity_id: !input thermostat
                          data:
                            temperature: "{{ secondary_target }}"

                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ completion_entity is not none and completion_entity != '' }}"
                              sequence:
                                - action: input_boolean.turn_on
                                  target:
                                    entity_id: !input completion_helper

                        - action: climate.set_hvac_mode
                          target:
                            entity_id: !input thermostat
                          data:
                            hvac_mode: "off"

                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ completion_entity is not none and completion_entity != '' }}"
                              sequence:
                                - action: input_boolean.turn_on
                                  target:
                                    entity_id: !input completion_helper

                        - sequence: !input heating_stopped_actions
                        - stop: "Occupancy cleared; HVAC turned off."

                    # Reached target: use TRV temperature if no room sensor,
                    # otherwise use the external room sensor.
                    - conditions:
                        - condition: template
                          value_template: >-
                            {% set room_used = room_sensor_entity is not none
                               and room_sensor_entity != '' %}
                            {{
                              (room_used
                               and room_temperature | float(-999) >= occupied_target | float)
                              or
                              (not room_used
                               and trv_temperature | float(-999) >= occupied_target | float)
                            }}
                      sequence:
                        - action: climate.set_temperature
                          target:
                            entity_id: !input thermostat
                          data:
                            temperature: "{{ secondary_target }}"

                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ completion_entity is not none and completion_entity != '' }}"
                              sequence:
                                - action: input_boolean.turn_on
                                  target:
                                    entity_id: !input completion_helper

                        - sequence: !input heating_stopped_actions
                        - stop: "Occupied target reached."

                    # TRV has caught up, but the external room sensor has not:
                    # increase the TRV setpoint by one step, capped at the ceiling.
                    - conditions:
                        - condition: template
                          value_template: >-
                            {{
                              room_sensor_entity is not none
                              and room_sensor_entity != ''
                              and room_temperature | float(-999) < occupied_target | float
                              and trv_temperature | float(-999)
                                >= active_setpoint | float - rounding_tolerance | float
                              and active_setpoint | float < device_ceiling | float
                            }}
                      sequence:
                        - variables:
                            active_setpoint: >-
                              {{ [active_setpoint | float + step_size | float,
                                  device_ceiling | float] | min }}

                        - action: climate.set_temperature
                          target:
                            entity_id: !input thermostat
                          data:
                            temperature: "{{ active_setpoint }}"

                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ completion_entity is not none and completion_entity != '' }}"
                              sequence:
                                - action: input_boolean.turn_on
                                  target:
                                    entity_id: !input completion_helper

                    # At the ceiling: wait for the room to reach target, the
                    # TRV temperature to fall below the active setpoint, or
                    # occupancy to clear. This prevents a tight loop at max.
                    - conditions:
                        - condition: template
                          value_template: >-
                            {{
                              room_sensor_entity is not none
                              and room_sensor_entity != ''
                              and room_temperature | float(-999) < occupied_target | float
                              and active_setpoint | float >= device_ceiling | float
                              and trv_temperature | float(-999)
                                >= active_setpoint | float - rounding_tolerance | float
                            }}
                      sequence:
                        - wait_template: >-
                            {{
                              states(occupancy_entity) != 'on'
                              or room_temperature | float(-999) >= occupied_target | float
                              or trv_temperature | float(-999)
                                < active_setpoint | float - rounding_tolerance | float
                            }}

    # If triggered while unoccupied (including at HA startup), apply the
    # unoccupied delay and turn the thermostat off if occupancy remains clear.
    default:
      - delay: !input unoccupied_delay
      - condition: template
        value_template: "{{ states(occupancy_entity) != 'on' }}"

      - action: climate.set_temperature
        target:
          entity_id: !input thermostat
        data:
          temperature: "{{ secondary_target }}"

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ completion_entity is not none and completion_entity != '' }}"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: !input completion_helper

      - action: climate.set_hvac_mode
        target:
          entity_id: !input thermostat
        data:
          hvac_mode: "off"

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ completion_entity is not none and completion_entity != '' }}"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: !input completion_helper

      - sequence: !input heating_stopped_actions
