blueprint:
  name: "🥶🌡️ Occupancy-Based Thermostat Cycle"
  description: >
    After occupancy is detected for the selected delay, turn on the thermostat
    in the selected heat or cool mode and set the first target temperature.
    When the room temperature reaches each target, wait the selected hold time
    and alternate to the other target. When occupancy clears for the selected
    delay, turn the thermostat off. Optionally turn on a boolean helper after
    successful thermostat actions.
  domain: automation

  input:
    presence_sensor:
      name: Presence / occupancy sensor
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: occupancy
            - domain: binary_sensor
              device_class: presence

    thermostat:
      name: Thermostat
      selector:
        entity:
          domain: climate

    room_temperature_sensor:
      name: Room temperature sensor (optional)
      description: >
        If selected, this sensor is used to detect when a target temperature
        is reached. Leave blank to use the thermostat's temperature reading.
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature

    completion_boolean:
      name: Completion boolean helper (optional)
      description: >
        Turn this input_boolean on after successful thermostat actions.
        It is not turned off automatically.
      default: ""
      selector:
        entity:
          filter:
            - domain: input_boolean

    occupied_delay:
      name: Delay after occupancy is detected
      default:
        hours: 0
        minutes: 0
        seconds: 0
      selector:
        duration:

    unoccupied_delay:
      name: Delay after occupancy clears before turning off
      default:
        hours: 0
        minutes: 5
        seconds: 0
      selector:
        duration:

    occupied_hvac_mode:
      name: HVAC mode when occupied
      description: Choose heat or cool, as supported by your thermostat.
      selector:
        select:
          options:
            - heat
            - cool
          mode: dropdown

    target_temperature:
      name: First target temperature
      description: The first setpoint used after occupancy is detected.
      selector:
        number:
          min: 0
          max: 100
          step: 0.5
          mode: box

    secondary_target_temperature:
      name: Secondary target temperature
      description: The setpoint used after the first target is reached.
      selector:
        number:
          min: 0
          max: 100
          step: 0.5
          mode: box

    target_reached_hold:
      name: Wait after a target temperature is reached
      description: The blueprint switches to the secondary target after this wait time.
      default:
        hours: 0
        minutes: 0
        seconds: 0
      selector:
        duration:

variables:
  climate_entity: !input thermostat
  room_temperature_sensor: !input room_temperature_sensor
  completion_boolean: !input completion_boolean
  active_hvac_mode: !input occupied_hvac_mode
  first_target: !input target_temperature
  second_target: !input secondary_target_temperature

trigger:
  - platform: state
    entity_id: !input presence_sensor
    to: "on"
    id: occupied

  - platform: state
    entity_id: !input presence_sensor
    to: "off"
    id: unoccupied

action:
  - choose:
      - conditions:
          - condition: trigger
            id: occupied
        sequence:
          - delay: !input occupied_delay
          - condition: state
            entity_id: !input presence_sensor
            state: "on"

          - action: climate.set_hvac_mode
            target:
              entity_id: !input thermostat
            data:
              hvac_mode: !input occupied_hvac_mode

          - variables:
              cycle_target: "{{ first_target | float }}"

          - action: climate.set_temperature
            target:
              entity_id: !input thermostat
            data:
              temperature: "{{ cycle_target }}"

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ completion_boolean not in [none, ''] }}"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: "{{ completion_boolean }}"

          - repeat:
              while:
                - condition: state
                  entity_id: !input presence_sensor
                  state: "on"
              sequence:
                - wait_template: >-
                    {% if room_temperature_sensor %}
                      {% set current = states(room_temperature_sensor) | float(none) %}
                    {% else %}
                      {% set current = state_attr(climate_entity, 'current_temperature') | float(none) %}
                    {% endif %}
                    {% set goal = cycle_target | float %}
                    {% if current is none %}
                      false
                    {% elif active_hvac_mode == 'heat' %}
                      {{ current >= goal }}
                    {% else %}
                      {{ current <= goal }}
                    {% endif %}

                - delay: !input target_reached_hold

                - condition: state
                  entity_id: !input presence_sensor
                  state: "on"

                - variables:
                    cycle_target: >-
                      {% if (cycle_target | float) == (first_target | float) %}
                        {{ second_target | float }}
                      {% else %}
                        {{ first_target | float }}
                      {% endif %}

                - action: climate.set_temperature
                  target:
                    entity_id: !input thermostat
                  data:
                    temperature: "{{ cycle_target }}"

                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ completion_boolean not in [none, ''] }}"
                      sequence:
                        - action: input_boolean.turn_on
                          target:
                            entity_id: "{{ completion_boolean }}"

      - conditions:
          - condition: trigger
            id: unoccupied
        sequence:
          - delay: !input unoccupied_delay
          - condition: state
            entity_id: !input presence_sensor
            state: "off"

          - action: climate.set_hvac_mode
            target:
              entity_id: !input thermostat
            data:
              hvac_mode: "off"

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ completion_boolean not in [none, ''] }}"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: "{{ completion_boolean }}"

mode: restart
