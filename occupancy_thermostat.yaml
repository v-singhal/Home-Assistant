blueprint:
  name: "🥶🌡️ [Thermostat] Occupancy-Based Thermostat Control"
  description: >
    Controls a thermostat or TRV using occupancy. Optionally uses an external
    room-temperature sensor and raises the TRV setpoint in steps, capped at
    25 °C or the device's maximum temperature.
  domain: automation

  input:
    occupancy_sensor:
      name: Occupancy or presence sensor
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class:
                - occupancy
                - presence

    thermostat:
      name: Thermostat or TRV
      selector:
        entity:
          filter:
            - domain: climate

    room_temperature_sensor:
      name: Room temperature sensor (optional)
      default: []
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature

    on_delay:
      name: Delay before heating starts
      default:
        hours: 0
        minutes: 0
        seconds: 0
      selector:
        duration:

    off_delay:
      name: Delay before heating stops after occupancy clears
      default:
        hours: 0
        minutes: 5
        seconds: 0
      selector:
        duration:

    occupied_temperature:
      name: Occupied target temperature
      description: Enter in °C, in 0.5 °C steps. The automation converts it for Fahrenheit devices.
      default: 20
      selector:
        number:
          min: 5
          max: 25
          step: 0.5
          unit_of_measurement: "°C"
          mode: box

    occupied_hvac_mode:
      name: HVAC mode while occupied
      default: heat
      selector:
        select:
          options:
            - heat
            - heat_cool
          mode: dropdown

    completion_helper:
      name: Completion helper (optional)
      description: Turned on after setup, setpoint changes, and HVAC-off actions.
      default: []
      selector:
        entity:
          filter:
            - domain: input_boolean

    heating_start_actions:
      name: Actions when heating starts (optional)
      default: []
      selector:
        action:

    heating_stop_actions:
      name: Actions when heating stops (optional)
      default: []
      selector:
        action:

trigger:
  - platform: state
    entity_id: !input occupancy_sensor
    to: "on"

  - platform: state
    entity_id: !input occupancy_sensor
    to: "off"

variables:
  occupancy_entity: !input occupancy_sensor
  climate_entity: !input thermostat
  room_entity: !input room_temperature_sensor
  completion_entity: !input completion_helper
  start_actions: !input heating_start_actions
  stop_actions: !input heating_stop_actions
  target_c: !input occupied_temperature
  selected_hvac_mode: !input occupied_hvac_mode

  is_fahrenheit: >
    {{ state_attr(climate_entity, 'temperature_unit') in ['°F', 'F'] }}

  step_native: >
    {{ 0.9 if is_fahrenheit else 0.5 }}

  tolerance_native: >
    {{ 0.45 if is_fahrenheit else 0.25 }}

  max_native: >
    {% set device_max = state_attr(climate_entity, 'max_temp') |
       float(77 if is_fahrenheit else 25) %}
    {% set absolute_max = 77 if is_fahrenheit else 25 %}
    {{ [device_max, absolute_max] | min }}

  target_native: >
    {% set target = (target_c | float * 9 / 5 + 32)
       if is_fahrenheit else (target_c | float) %}
    {{ [target, max_native | float] | min }}

condition: []

action:
  # Apply the on-delay only if occupancy is currently on.
  - if:
      - condition: state
        entity_id: !input occupancy_sensor
        state: "on"
    then:
      - delay: !input on_delay

      # Do not set up heating if occupancy cleared during the delay.
      - if:
          - condition: state
            entity_id: !input occupancy_sensor
            state: "on"
        then:
          - action: climate.set_hvac_mode
            target:
              entity_id: "{{ climate_entity }}"
            data:
              hvac_mode: !input occupied_hvac_mode

          # With an external room sensor, begin one step above the room target.
          # Without one, use the occupied target itself.
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ room_entity != [] }}"
                sequence:
                  - action: climate.set_temperature
                    target:
                      entity_id: "{{ climate_entity }}"
                    data:
                      temperature: >
                        {{ [target_native | float + step_native | float,
                            max_native | float] | min }}
              - conditions:
                  - condition: template
                    value_template: "{{ room_entity == [] }}"
                sequence:
                  - action: climate.set_temperature
                    target:
                      entity_id: "{{ climate_entity }}"
                    data:
                      temperature: "{{ target_native | float }}"

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ completion_entity != [] }}"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: "{{ completion_entity }}"

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ start_actions | length > 0 }}"
                sequence: !input heating_start_actions

  # This loop monitors occupancy and live temperature changes while the
  # automation is running. It does not reset the iterative TRV setpoint.
  - repeat:
      sequence:
        - choose:
            # Occupancy is on: control heating according to the available sensors.
            - conditions:
                - condition: state
                  entity_id: !input occupancy_sensor
                  state: "on"
              sequence:
                - choose:
                    # External room sensor is configured.
                    - conditions:
                        - condition: template
                          value_template: "{{ room_entity != [] }}"
                      sequence:
                        - choose:
                            # Room has reached target: stop HVAC and wait for
                            # occupancy to clear or the room to cool.
                            - conditions:
                                - condition: template
                                  value_template: >
                                    {% set raw = states(room_entity) | float(none) %}
                                    {% set unit = state_attr(room_entity, 'unit_of_measurement') %}
                                    {% if raw is none %}
                                      false
                                    {% elif unit in ['°F', 'F'] %}
                                      {{ (raw - 32) * 5 / 9 >= target_c | float }}
                                    {% else %}
                                      {{ raw >= target_c | float }}
                                    {% endif %}
                              sequence:
                                - action: climate.set_hvac_mode
                                  target:
                                    entity_id: "{{ climate_entity }}"
                                  data:
                                    hvac_mode: "off"

                                - choose:
                                    - conditions:
                                        - condition: template
                                          value_template: "{{ completion_entity != [] }}"
                                      sequence:
                                        - action: input_boolean.turn_on
                                          target:
                                            entity_id: "{{ completion_entity }}"

                                - choose:
                                    - conditions:
                                        - condition: template
                                          value_template: "{{ stop_actions | length > 0 }}"
                                      sequence: !input heating_stop_actions

                                - wait_template: >
                                    {% set raw = states(room_entity) | float(none) %}
                                    {% set unit = state_attr(room_entity, 'unit_of_measurement') %}
                                    {% if is_state(occupancy_entity, 'off') %}
                                      true
                                    {% elif raw is none %}
                                      false
                                    {% elif unit in ['°F', 'F'] %}
                                      {{ (raw - 32) * 5 / 9 < target_c | float }}
                                    {% else %}
                                      {{ raw < target_c | float }}
                                    {% endif %}

                                # If occupancy is still on, resume heating.
                                - if:
                                    - condition: state
                                      entity_id: !input occupancy_sensor
                                      state: "on"
                                  then:
                                    - action: climate.set_hvac_mode
                                      target:
                                        entity_id: "{{ climate_entity }}"
                                      data:
                                        hvac_mode: !input occupied_hvac_mode

                                    - choose:
                                        - conditions:
                                            - condition: template
                                              value_template: "{{ start_actions | length > 0 }}"
                                          sequence: !input heating_start_actions

                            # Room is below target: keep heating and step up the
                            # TRV setpoint when its measured temperature catches up.
                            - conditions:
                                - condition: template
                                  value_template: >
                                    {% set raw = states(room_entity) | float(none) %}
                                    {% set unit = state_attr(room_entity, 'unit_of_measurement') %}
                                    {% if raw is none %}
                                      true
                                    {% elif unit in ['°F', 'F'] %}
                                      {{ (raw - 32) * 5 / 9 < target_c | float }}
                                    {% else %}
                                      {{ raw < target_c | float }}
                                    {% endif %}
                              sequence:
                                - action: climate.set_hvac_mode
                                  target:
                                    entity_id: "{{ climate_entity }}"
                                  data:
                                    hvac_mode: !input occupied_hvac_mode

                                # Increase by 0.5 °C / 0.9 °F only when the
                                # TRV temperature catches its current setpoint.
                                - choose:
                                    - conditions:
                                        - condition: template
                                          value_template: >
                                            {% set current = state_attr(climate_entity, 'current_temperature') | float(-999) %}
                                            {% set setpoint = state_attr(climate_entity, 'temperature') | float(target_native) %}
                                            {{ current >= setpoint - tolerance_native | float
                                               and setpoint < max_native | float }}
                                      sequence:
                                        - action: climate.set_temperature
                                          target:
                                            entity_id: "{{ climate_entity }}"
                                          data:
                                            temperature: >
                                              {% set current_setpoint = state_attr(climate_entity, 'temperature') | float(target_native) %}
                                              {{ [current_setpoint + step_native | float,
                                                  max_native | float] | min }}

                                        - choose:
                                            - conditions:
                                                - condition: template
                                                  value_template: "{{ completion_entity != [] }}"
                                              sequence:
                                                - action: input_boolean.turn_on
                                                  target:
                                                    entity_id: "{{ completion_entity }}"

                                # At the cap, wait for the room to reach target
                                # or occupancy to clear. Otherwise wait for the
                                # next TRV/room/occupancy change.
                                - choose:
                                    - conditions:
                                        - condition: template
                                          value_template: >
                                            {% set current = state_attr(climate_entity, 'current_temperature') | float(-999) %}
                                            {% set setpoint = state_attr(climate_entity, 'temperature') | float(target_native) %}
                                            {{ setpoint >= max_native | float
                                               and current >= setpoint - tolerance_native | float }}
                                      sequence:
                                        - wait_template: >
                                            {% set raw = states(room_entity) | float(none) %}
                                            {% set unit = state_attr(room_entity, 'unit_of_measurement') %}
                                            {% if is_state(occupancy_entity, 'off') %}
                                              true
                                            {% elif raw is none %}
                                              false
                                            {% elif unit in ['°F', 'F'] %}
                                              {{ (raw - 32) * 5 / 9 >= target_c | float }}
                                            {% else %}
                                              {{ raw >= target_c | float }}
                                            {% endif %}
                                  default:
                                    - wait_template: >
                                        {% set raw = states(room_entity) | float(none) %}
                                        {% set unit = state_attr(room_entity, 'unit_of_measurement') %}
                                        {% set current = state_attr(climate_entity, 'current_temperature') | float(-999) %}
                                        {% set setpoint = state_attr(climate_entity, 'temperature') | float(target_native) %}
                                        {% set room_at_target = (
                                          (raw - 32) * 5 / 9 >= target_c | float
                                          if raw is not none and unit in ['°F', 'F']
                                          else raw >= target_c | float
                                          if raw is not none
                                          else false
                                        ) %}
                                        {{ is_state(occupancy_entity, 'off')
                                           or room_at_target
                                           or current >= setpoint - tolerance_native | float }}

                    # No external room sensor: use the TRV's own temperature.
                    - conditions:
                        - condition: template
                          value_template: "{{ room_entity == [] }}"
                      sequence:
                        - action: climate.set_hvac_mode
                          target:
                            entity_id: "{{ climate_entity }}"
                          data:
                            hvac_mode: !input occupied_hvac_mode

                        - action: climate.set_temperature
                          target:
                            entity_id: "{{ climate_entity }}"
                          data:
                            temperature: "{{ target_native | float }}"

                        - wait_template: >
                            {% set current = state_attr(climate_entity, 'current_temperature') | float(-999) %}
                            {{ is_state(occupancy_entity, 'off')
                               or current >= target_native | float }}

                        # Turn HVAC off at target, then resume if the TRV cools
                        # while occupancy remains on.
                        - if:
                            - condition: state
                              entity_id: !input occupancy_sensor
                              state: "on"
                            - condition: template
                              value_template: >
                                {{ state_attr(climate_entity, 'current_temperature') | float(-999)
                                   >= target_native | float }}
                          then:
                            - action: climate.set_hvac_mode
                              target:
                                entity_id: "{{ climate_entity }}"
                              data:
                                hvac_mode: "off"

                            - choose:
                                - conditions:
                                    - condition: template
                                      value_template: "{{ completion_entity != [] }}"
                                  sequence:
                                    - action: input_boolean.turn_on
                                      target:
                                        entity_id: "{{ completion_entity }}"

                            - choose:
                                - conditions:
                                    - condition: template
                                      value_template: "{{ stop_actions | length > 0 }}"
                                  sequence: !input heating_stop_actions

                            - wait_template: >
                                {% set current = state_attr(climate_entity, 'current_temperature') | float(-999) %}
                                {{ is_state(occupancy_entity, 'off')
                                   or current < target_native | float }}

                            - if:
                                - condition: state
                                  entity_id: !input occupancy_sensor
                                  state: "on"
                              then:
                                - action: climate.set_hvac_mode
                                  target:
                                    entity_id: "{{ climate_entity }}"
                                  data:
                                    hvac_mode: !input occupied_hvac_mode

                                - action: climate.set_temperature
                                  target:
                                    entity_id: "{{ climate_entity }}"
                                  data:
                                    temperature: "{{ target_native | float }}"

                                - choose:
                                    - conditions:
                                        - condition: template
                                          value_template: "{{ start_actions | length > 0 }}"
                                      sequence: !input heating_start_actions

            # Occupancy is off: wait the configured delay, then stop HVAC if it
            # has not become occupied again.
            - conditions:
                - condition: state
                  entity_id: !input occupancy_sensor
                  state: "off"
              sequence:
                - delay: !input off_delay

                - if:
                    - condition: state
                      entity_id: !input occupancy_sensor
                      state: "off"
                  then:
                    - action: climate.set_hvac_mode
                      target:
                        entity_id: "{{ climate_entity }}"
                      data:
                        hvac_mode: "off"

                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ completion_entity != [] }}"
                          sequence:
                            - action: input_boolean.turn_on
                              target:
                                entity_id: "{{ completion_entity }}"

                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ stop_actions | length > 0 }}"
                          sequence: !input heating_stop_actions

                    - stop: "Occupancy cleared; HVAC turned off."

mode: single
