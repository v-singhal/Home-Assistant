blueprint:
  name: "🥶🌡️ [Thermostat] Occupancy-Based Thermostat Control"
  description: >
    Controls a thermostat or TRV based on occupancy. With an external room
    temperature sensor, increases the TRV setpoint in 0.5°C / 0.9°F steps
    when the TRV temperature catches up, until the room reaches the occupied
    target. Without an external sensor, uses the TRV's current temperature.
    After the target is reached, heating is turned off and monitored; if the
    room cools below target while occupied, heating resumes. Setpoints are
    capped at 25°C or the device's max_temp, whichever is lower.
  domain: automation

  input:
    occupancy_sensor:
      name: Occupancy / presence sensor
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: occupancy
            - domain: binary_sensor
              device_class: presence

    thermostat:
      name: Thermostat or TRV
      selector:
        entity:
          filter:
            - domain: climate

    room_temperature_sensor:
      name: External room temperature sensor (optional)
      default: null
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature

    occupied_delay:
      name: Delay before starting when occupied
      default:
        hours: 0
        minutes: 0
        seconds: 0
      selector:
        duration: {}

    unoccupied_delay:
      name: Delay before turning HVAC off when unoccupied
      default:
        hours: 0
        minutes: 5
        seconds: 0
      selector:
        duration: {}

    occupied_temperature_c:
      name: Occupied target temperature
      default: 20
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
          mode: box

    occupied_hvac_mode:
      name: HVAC mode when occupied
      default: heat
      selector:
        select:
          options:
            - heat
            - heat_cool
          mode: dropdown

    completion_helper:
      name: Completion boolean helper (optional)
      description: Turned on after setup, setpoint changes, and HVAC-off actions.
      default: null
      selector:
        entity:
          filter:
            - domain: input_boolean

    heating_started_actions:
      name: Actions when occupied heating starts or resumes
      default: []
      selector:
        action: {}

    heating_stopped_actions:
      name: Actions when heating stops or occupancy clears
      default: []
      selector:
        action: {}

mode: single
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input occupancy_sensor
    to: "on"
    id: occupied

  - platform: state
    entity_id: !input occupancy_sensor
    to: "off"
    id: unoccupied

  - platform: homeassistant
    event: start
    id: startup

variables:
  occupancy_entity: !input occupancy_sensor
  thermostat_entity: !input thermostat
  room_sensor_entity: !input room_temperature_sensor
  completion_entity: !input completion_helper
  occupied_temp_input_c: !input occupied_temperature_c

  climate_unit: "{{ state_attr(thermostat_entity, 'temperature_unit') or '°C' }}"
  is_fahrenheit: "{{ climate_unit in ['°F', 'F'] }}"

  device_ceiling: >-
    {% set ceiling = 77 if is_fahrenheit else 25 %}
    {% set device_max = state_attr(thermostat_entity, 'max_temp') | float(ceiling) %}
    {{ [ceiling, device_max] | min }}

  occupied_target: >-
    {% set c = occupied_temp_input_c | float %}
    {% set converted = (c * 9 / 5 + 32) if is_fahrenheit else c %}
    {{ [converted, device_ceiling | float] | min }}

  step_size: "{{ 0.9 if is_fahrenheit else 0.5 }}"
  rounding_tolerance: "{{ 0.45 if is_fahrenheit else 0.25 }}"

action:
  - repeat:
      while:
        - condition: template
          value_template: "{{ true }}"
      sequence:
        - choose:
            # Occupied: heat to target, then monitor for cooldown.
            - conditions:
                - condition: template
                  value_template: "{{ states(occupancy_entity) == 'on' }}"
              sequence:
                - delay: !input occupied_delay
                - condition: template
                  value_template: "{{ states(occupancy_entity) == 'on' }}"

                - action: climate.set_hvac_mode
                  target:
                    entity_id: !input thermostat
                  data:
                    hvac_mode: !input occupied_hvac_mode

                - variables:
                    active_setpoint: "{{ occupied_target | float }}"

                - action: climate.set_temperature
                  target:
                    entity_id: !input thermostat
                  data:
                    temperature: "{{ active_setpoint }}"

                - sequence: !input heating_started_actions

                - choose:
                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ completion_entity is not none and completion_entity != '' }}
                      sequence:
                        - action: input_boolean.turn_on
                          target:
                            entity_id: !input completion_helper

                # Continue until occupied target is reached or occupancy clears.
                - repeat:
                    sequence:
                      - wait_template: >-
                          {% set trv = state_attr(thermostat_entity, 'current_temperature') | float(-999) %}
                          {% set room_used = room_sensor_entity is not none and room_sensor_entity != '' %}
                          {% if room_used %}
                            {% set raw = states(room_sensor_entity) | float(-999) %}
                            {% set unit = state_attr(room_sensor_entity, 'unit_of_measurement') %}
                            {% if is_fahrenheit and unit in ['°C', 'C'] %}
                              {% set room = raw * 9 / 5 + 32 %}
                            {% elif not is_fahrenheit and unit in ['°F', 'F'] %}
                              {% set room = (raw - 32) * 5 / 9 %}
                            {% else %}
                              {% set room = raw %}
                            {% endif %}
                            {{
                              states(occupancy_entity) != 'on'
                              or room >= occupied_target | float
                              or trv >= active_setpoint | float - rounding_tolerance | float
                            }}
                          {% else %}
                            {{
                              states(occupancy_entity) != 'on'
                              or trv >= occupied_target | float
                            }}
                          {% endif %}

                      - variables:
                          trv_now: >-
                            {{ state_attr(thermostat_entity, 'current_temperature') | float(-999) }}
                          room_sensor_used: >-
                            {{ room_sensor_entity is not none and room_sensor_entity != '' }}
                          room_now: >-
                            {% if room_sensor_entity is none or room_sensor_entity == '' %}
                              -999
                            {% else %}
                              {% set raw = states(room_sensor_entity) | float(-999) %}
                              {% set unit = state_attr(room_sensor_entity, 'unit_of_measurement') %}
                              {% if is_fahrenheit and unit in ['°C', 'C'] %}
                                {{ raw * 9 / 5 + 32 }}
                              {% elif not is_fahrenheit and unit in ['°F', 'F'] %}
                                {{ (raw - 32) * 5 / 9 }}
                              {% else %}
                                {{ raw }}
                              {% endif %}
                            {% endif %}

                      # Increase the TRV setpoint when it catches up but the
                      # external room sensor is still below target.
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: >-
                                  {{
                                    states(occupancy_entity) == 'on'
                                    and room_sensor_used
                                    and room_now | float(-999) < occupied_target | float
                                    and trv_now | float(-999)
                                      >= active_setpoint | float - rounding_tolerance | float
                                    and active_setpoint | float < device_ceiling | float
                                  }}
                            sequence:
                              - variables:
                                  active_setpoint: >-
                                    {{ [active_setpoint | float + step_size | float,
                                        device_ceiling | float] | min }}

                              - action: climate.set_temperature
                                target:
                                  entity_id: !input thermostat
                                data:
                                  temperature: "{{ active_setpoint }}"

                              - choose:
                                  - conditions:
                                      - condition: template
                                        value_template: >-
                                          {{ completion_entity is not none and completion_entity != '' }}
                                    sequence:
                                      - action: input_boolean.turn_on
                                        target:
                                          entity_id: !input completion_helper

                          # At the ceiling, wait for the room to reach target,
                          # occupancy to clear, or the TRV to cool below setpoint.
                          - conditions:
                              - condition: template
                                value_template: >-
                                  {{
                                    states(occupancy_entity) == 'on'
                                    and room_sensor_used
                                    and room_now | float(-999) < occupied_target | float
                                    and active_setpoint | float >= device_ceiling | float
                                    and trv_now | float(-999)
                                      >= active_setpoint | float - rounding_tolerance | float
                                  }}
                            sequence:
                              - wait_template: >-
                                  {% set trv = state_attr(thermostat_entity, 'current_temperature') | float(-999) %}
                                  {% set raw = states(room_sensor_entity) | float(-999) %}
                                  {% set unit = state_attr(room_sensor_entity, 'unit_of_measurement') %}
                                  {% if is_fahrenheit and unit in ['°C', 'C'] %}
                                    {% set room = raw * 9 / 5 + 32 %}
                                  {% elif not is_fahrenheit and unit in ['°F', 'F'] %}
                                    {% set room = (raw - 32) * 5 / 9 %}
                                  {% else %}
                                    {% set room = raw %}
                                  {% endif %}
                                  {{
                                    states(occupancy_entity) != 'on'
                                    or room >= occupied_target | float
                                    or trv < active_setpoint | float - rounding_tolerance | float
                                  }}

                    until:
                      - condition: template
                        value_template: >-
                          {% set trv = state_attr(thermostat_entity, 'current_temperature') | float(-999) %}
                          {% if room_sensor_entity is not none and room_sensor_entity != '' %}
                            {% set raw = states(room_sensor_entity) | float(-999) %}
                            {% set unit = state_attr(room_sensor_entity, 'unit_of_measurement') %}
                            {% if is_fahrenheit and unit in ['°C', 'C'] %}
                              {% set room = raw * 9 / 5 + 32 %}
                            {% elif not is_fahrenheit and unit in ['°F', 'F'] %}
                              {% set room = (raw - 32) * 5 / 9 %}
                            {% else %}
                              {% set room = raw %}
                            {% endif %}
                            {{ states(occupancy_entity) != 'on' or room >= occupied_target | float }}
                          {% else %}
                            {{ states(occupancy_entity) != 'on' or trv >= occupied_target | float }}
                          {% endif %}

                # Target reached: turn HVAC off, then wait for cooldown or
                # occupancy to clear.
                - choose:
                    - conditions:
                        - condition: template
                          value_template: >-
                            {% set trv = state_attr(thermostat_entity, 'current_temperature') | float(-999) %}
                            {% if room_sensor_entity is not none and room_sensor_entity != '' %}
                              {% set raw = states(room_sensor_entity) | float(-999) %}
                              {% set unit = state_attr(room_sensor_entity, 'unit_of_measurement') %}
                              {% if is_fahrenheit and unit in ['°C', 'C'] %}
                                {% set room = raw * 9 / 5 + 32 %}
                              {% elif not is_fahrenheit and unit in ['°F', 'F'] %}
                                {% set room = (raw - 32) * 5 / 9 %}
                              {% else %}
                                {% set room = raw %}
                              {% endif %}
                              {{ states(occupancy_entity) == 'on' and room >= occupied_target | float }}
                            {% else %}
                              {{ states(occupancy_entity) == 'on' and trv >= occupied_target | float }}
                            {% endif %}
                      sequence:
                        - action: climate.set_hvac_mode
                          target:
                            entity_id: !input thermostat
                          data:
                            hvac_mode: "off"

                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: >-
                                    {{ completion_entity is not none and completion_entity != '' }}
                              sequence:
                                - action: input_boolean.turn_on
                                  target:
                                    entity_id: !input completion_helper

                        - sequence: !input heating_stopped_actions

                        - wait_template: >-
                            {% set trv = state_attr(thermostat_entity, 'current_temperature') | float(-999) %}
                            {% if room_sensor_entity is not none and room_sensor_entity != '' %}
                              {% set raw = states(room_sensor_entity) | float(-999) %}
                              {% set unit = state_attr(room_sensor_entity, 'unit_of_measurement') %}
                              {% if is_fahrenheit and unit in ['°C', 'C'] %}
                                {% set room = raw * 9 / 5 + 32 %}
                              {% elif not is_fahrenheit and unit in ['°F', 'F'] %}
                                {% set room = (raw - 32) * 5 / 9 %}
                              {% else %}
                                {% set room = raw %}
                              {% endif %}
                              {{
                                states(occupancy_entity) != 'on'
                                or room < occupied_target | float - rounding_tolerance | float
                              }}
                            {% else %}
                              {{
                                states(occupancy_entity) != 'on'
                                or trv < occupied_target | float - rounding_tolerance | float
                              }}
                            {% endif %}

            # Unoccupied: delay HVAC-off, but cancel the delay if occupancy returns.
            default:
              - wait_template: "{{ states(occupancy_entity) == 'on' }}"
                timeout: !input unoccupied_delay
                continue_on_timeout: true

              - if:
                  - condition: template
                    value_template: "{{ states(occupancy_entity) != 'on' }}"
                then:
                  - action: climate.set_hvac_mode
                    target:
                      entity_id: !input thermostat
                    data:
                      hvac_mode: "off"

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: >-
                              {{ completion_entity is not none and completion_entity != '' }}
                        sequence:
                          - action: input_boolean.turn_on
                            target:
                              entity_id: !input completion_helper

                  - sequence: !input heating_stopped_actions

                  - wait_template: "{{ states(occupancy_entity) == 'on' }}"
