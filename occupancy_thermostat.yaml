blueprint:
  name: "🌡️ Occupancy-Based Thermostat Control"
  description: >
    After occupancy is detected for the selected delay, set the thermostat
    to the selected HVAC mode and target temperature. After occupancy clears
    for the selected delay, set the thermostat HVAC mode to off.
  domain: automation

  input:
    presence_sensor:
      name: Presence / occupancy sensor
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: occupancy
            - domain: binary_sensor
              device_class: presence

    thermostat:
      name: Thermostat
      selector:
        entity:
          domain: climate

    occupied_delay:
      name: Delay after occupancy is detected
      default:
        hours: 0
        minutes: 0
        seconds: 0
      selector:
        duration:

    unoccupied_delay:
      name: Delay after occupancy clears
      default:
        hours: 0
        minutes: 5
        seconds: 0
      selector:
        duration:

    occupied_hvac_mode:
      name: HVAC mode when occupied
      description: Choose a mode supported by your thermostat.
      selector:
        select:
          options:
            - heat
            - cool
            - heat_cool
            - auto
          mode: dropdown

    target_temperature:
      name: Target temperature when occupied
      selector:
        number:
          min: 0
          max: 100
          step: 0.5
          mode: box

trigger:
  - platform: state
    entity_id: !input presence_sensor
    to: "on"
    id: occupied

  - platform: state
    entity_id: !input presence_sensor
    to: "off"
    id: unoccupied

action:
  - choose:
      - conditions:
          - condition: trigger
            id: occupied
        sequence:
          - delay: !input occupied_delay
          - condition: state
            entity_id: !input presence_sensor
            state: "on"
          - action: climate.set_hvac_mode
            target:
              entity_id: !input thermostat
            data:
              hvac_mode: !input occupied_hvac_mode
          - action: climate.set_temperature
            target:
              entity_id: !input thermostat
            data:
              temperature: !input target_temperature

      - conditions:
          - condition: trigger
            id: unoccupied
        sequence:
          - delay: !input unoccupied_delay
          - condition: state
            entity_id: !input presence_sensor
            state: "off"
          - action: climate.set_hvac_mode
            target:
              entity_id: !input thermostat
            data:
              hvac_mode: "off"

mode: restart
