blueprint:
  name: 🥶🌡️ [Thermostat] Central boiler target from active smart TRVs - Simplified
  description: >
    Sets a central boiler thermostat to the highest target of the selected,
    active radiator thermostats, plus a configurable boost, capped at a
    configurable maximum. Turns the central thermostat off when no selected
    TRVs are active. Makes no change if a selected TRV is unknown or
    unavailable, or an active TRV has no numeric target.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"

  input:
    central_thermostat:
      name: Central boiler thermostat
      description: Climate entity connected to the boiler.
      selector:
        entity:
          domain: climate

    radiator_thermostats:
      name: Radiator thermostats
      description: Select up to 10 TRVs.
      default: []
      selector:
        entity:
          domain: climate
          multiple: true

    central_thermostat_boost:
      name: Central thermostat boost
      description: Offset added to the highest active TRV target.
      default: 0
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          unit_of_measurement: "°"
          mode: box

    central_thermostat_maximum_target:
      name: Central thermostat maximum target
      description: Upper cap for the target sent to the central thermostat.
      default: 30
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°"
          mode: box

    debounce_delay:
      name: Debounce delay
      description: >
        Wait this many seconds after a trigger, then evaluate the latest
        readings. Changes during the wait are coalesced.
      default: 10
      selector:
        number:
          min: 0
          max: 300
          step: 1
          unit_of_measurement: seconds
          mode: box

triggers:
  - trigger: homeassistant
    event: start

  - trigger: state
    entity_id: !input central_thermostat

  - trigger: state
    entity_id: !input radiator_thermostats

actions:
  - delay:
      seconds: !input debounce_delay

  # These are evaluated after the delay, so the latest states are used.
  - variables:
      central_entity: !input central_thermostat
      selected_trvs: !input radiator_thermostats
      boost: !input central_thermostat_boost
      maximum_target: !input central_thermostat_maximum_target

  - variables:
      active_trvs: >-
        {{ expand(selected_trvs)
           | rejectattr('state', 'equalto', 'off')
           | list }}
      bad_trv_state: >-
        {% set ns = namespace(bad=false) %}
        {% for entity_id in selected_trvs %}
          {% if states(entity_id) in ['unknown', 'unavailable'] %}
            {% set ns.bad = true %}
          {% endif %}
        {% endfor %}
        {{ ns.bad }}

  - variables:
      missing_active_target: >-
        {% set ns = namespace(missing=false) %}
        {% for trv in active_trvs %}
          {% if not is_number(trv.attributes.get('temperature')) %}
            {% set ns.missing = true %}
          {% endif %}
        {% endfor %}
        {{ ns.missing }}
      highest_active_target: >-
        {% set ns = namespace(maximum=none) %}
        {% for trv in active_trvs %}
          {% set target = trv.attributes.get('temperature') %}
          {% if is_number(target) %}
            {% set target = target | float %}
            {% if ns.maximum is none or target > ns.maximum %}
              {% set ns.maximum = target %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.maximum if ns.maximum is not none else 0 }}

  - variables:
      requested_target: >-
        {{ [
          (highest_active_target | float) + (boost | float),
          maximum_target | float
        ] | min | round(1) }}

  - choose:
      # No active TRVs: turn the central thermostat off, unless a selected
      # TRV is unavailable or unknown—in that case, leave it unchanged.
      - conditions:
          - condition: template
            value_template: >-
              {{ (bad_trv_state | string | trim | lower) != 'true'
                 and active_trvs | count == 0 }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ states(central_entity) != 'off' }}"
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: "{{ central_entity }}"
                data:
                  hvac_mode: "off"

      # Active TRVs with valid targets: heat and set the capped target.
      - conditions:
          - condition: template
            value_template: >-
              {{ (bad_trv_state | string | trim | lower) != 'true'
                 and (missing_active_target | string | trim | lower) != 'true'
                 and active_trvs | count > 0 }}
        sequence:
          - if:
              - condition: template
                value_template: >-
                  {% set current = state_attr(central_entity, 'temperature') %}
                  {{ states(central_entity) != 'heat'
                     or not is_number(current)
                     or ((current | float) - (requested_target | float)) | abs > 0.05 }}
            then:
              - action: climate.set_temperature
                target:
                  entity_id: "{{ central_entity }}"
                data:
                  temperature: "{{ requested_target }}"
                  hvac_mode: "heat"

mode: single
