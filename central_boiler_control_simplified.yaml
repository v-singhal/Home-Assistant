blueprint:
  name: "🥶🌡️ [Thermostat] Central boiler target from SmartTRVs - Simplified"
  description: >
    Controls a central boiler thermostat from up to 10 radiator thermostats.
    The central target is the greater of the central thermostat's current
    temperature plus a boost, or the highest active TRV target. The result is
    capped at the configured maximum. The central thermostat is turned off
    when all selected TRVs are off.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"

  input:
    central_thermostat:
      name: Central thermostat
      selector:
        entity:
          domain: climate

    radiator_thermostats:
      name: Smart radiator thermostats
      description: Select no more than 10 climate entities.
      default: []
      selector:
        entity:
          domain: climate
          multiple: true

    central_thermostat_boost:
      name: Central thermostat boost
      description: Added to the central thermostat's measured temperature.
      default: 2
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          unit_of_measurement: "°"
          mode: box

    central_thermostat_maximum_target:
      name: Central thermostat maximum target
      description: Upper cap for the target sent to the central thermostat.
      default: 25
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°"
          mode: box

    debounce_delay:
      name: Debounce delay
      description: >
        Wait this many seconds after a trigger, then evaluate the latest
        readings. Changes during the wait are coalesced.
      default: 5
      selector:
        number:
          min: 0
          max: 300
          step: 1
          unit_of_measurement: seconds
          mode: box

triggers:
  - trigger: homeassistant
    event: start

  - trigger: state
    entity_id: !input central_thermostat

  - trigger: state
    entity_id: !input radiator_thermostats

actions:
  - delay:
      seconds: !input debounce_delay

  # Read inputs after the debounce delay.
  - variables:
      central: !input central_thermostat
      trvs: !input radiator_thermostats
      boost: !input central_thermostat_boost
      maximum_target: !input central_thermostat_maximum_target

  # Calculate TRV status and the highest active TRV target from entity IDs.
  - variables:
      active_count: >-
        {% set ns = namespace(value=0) %}
        {% for entity_id in trvs %}
          {% if states(entity_id) != 'off' %}
            {% set ns.value = ns.value + 1 %}
          {% endif %}
        {% endfor %}
        {{ ns.value }}

      invalid_trv_state: >-
        {% set ns = namespace(bad=false) %}
        {% for entity_id in trvs %}
          {% if states(entity_id) in ['unknown', 'unavailable'] %}
            {% set ns.bad = true %}
          {% endif %}
        {% endfor %}
        {{ ns.bad }}

      invalid_target: >-
        {% set ns = namespace(bad=false) %}
        {% for entity_id in trvs %}
          {% if states(entity_id) != 'off'
                and not is_number(state_attr(entity_id, 'temperature')) %}
            {% set ns.bad = true %}
          {% endif %}
        {% endfor %}
        {{ ns.bad }}

      highest_target: >-
        {% set ns = namespace(value=none) %}
        {% for entity_id in trvs %}
          {% if states(entity_id) != 'off' %}
            {% set target = state_attr(entity_id, 'temperature') %}
            {% if is_number(target) %}
              {% set target = target | float %}
              {% if ns.value is none or target > ns.value %}
                {% set ns.value = target %}
              {% endif %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.value if ns.value is not none else 0 }}

  # Use the central measured temperature, not its existing setpoint.
  - variables:
      central_current_temperature: "{{ state_attr(central, 'current_temperature') }}"

  # target = min(max(central measured temperature + boost, highest TRV target),
  #              configured maximum)
  - variables:
      target_to_send: >-
        {{ [
          [
            (central_current_temperature | float(0)) + (boost | float),
            highest_target | float
          ] | max,
          maximum_target | float
        ] | min | round(1) }}

  - choose:
      # No active TRVs: turn the central thermostat off.
      - conditions:
          - condition: template
            value_template: >-
              {{ trvs | count <= 10
                 and (invalid_trv_state | string | trim | lower) != 'true'
                 and (active_count | int) == 0 }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ states(central) != 'off' }}"
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: !input central_thermostat
                data:
                  hvac_mode: "off"

      # Active TRVs with valid targets and a valid central temperature.
      - conditions:
          - condition: template
            value_template: >-
              {{ trvs | count <= 10
                 and (invalid_trv_state | string | trim | lower) != 'true'
                 and (invalid_target | string | trim | lower) != 'true'
                 and is_number(central_current_temperature)
                 and (active_count | int) > 0 }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ states(central) != 'heat' }}"
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: !input central_thermostat
                data:
                  hvac_mode: "heat"

          - if:
              - condition: template
                value_template: >-
                  {% set current = state_attr(central, 'temperature') %}
                  {{ not is_number(current)
                     or ((current | float) - (target_to_send | float)) | abs > 0.05 }}
            then:
              - action: climate.set_temperature
                target:
                  entity_id: !input central_thermostat
                data:
                  temperature: "{{ target_to_send }}"

mode: single
