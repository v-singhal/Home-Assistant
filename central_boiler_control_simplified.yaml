blueprint:
  name: "🥶🌡️ [Thermostat] Central boiler target from SmartTRVs - Simplified"
  description: >
    Sets a central boiler thermostat to the highest active radiator
    thermostat target plus a boost, capped at a maximum. Turns the central
    thermostat off when all selected radiator thermostats are off. Select no
    more than 10 radiator thermostats.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"

  input:
    central_thermostat:
      name: Central thermostat
      selector:
        entity:
          domain: climate

    radiator_thermostats:
      name: Smart radiator thermostats
      default: []
      selector:
        entity:
          domain: climate
          multiple: true

    central_thermostat_boost:
      name: Central thermostat boost
      description: Offset added to the highest active TRV target.
      default: 2
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          unit_of_measurement: "°"
          mode: box

    central_thermostat_maximum_target:
      name: Central thermostat maximum target
      description: Upper cap for the target sent to the central thermostat.
      default: 25
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°"
          mode: box

    debounce_delay:
      name: Debounce delay
      description: >
        Wait this many seconds after a trigger, then evaluate the latest
        readings. Changes during the wait are coalesced.
      default: 5
      selector:
        number:
          min: 0
          max: 300
          step: 1
          unit_of_measurement: seconds
          mode: box

triggers:
  - trigger: homeassistant
    event: start

  - trigger: state
    entity_id: !input central_thermostat

  - trigger: state
    entity_id: !input radiator_thermostats

actions:
  - delay:
      seconds: !input debounce_delay

  - variables:
      central: !input central_thermostat
      trvs: !input radiator_thermostats
      boost: !input central_thermostat_boost
      maximum_target: !input central_thermostat_maximum_target

  - variables:
      active_count: >-
        {% set ns = namespace(value=0) %}
        {% for entity_id in trvs %}
          {% if states(entity_id) != 'off' %}
            {% set ns.value = ns.value + 1 %}
          {% endif %}
        {% endfor %}
        {{ ns.value }}

      invalid_trv_state: >-
        {% set ns = namespace(bad=false) %}
        {% for entity_id in trvs %}
          {% if states(entity_id) in ['unknown', 'unavailable'] %}
            {% set ns.bad = true %}
          {% endif %}
        {% endfor %}
        {{ ns.bad }}

      invalid_target: >-
        {% set ns = namespace(bad=false) %}
        {% for entity_id in trvs %}
          {% if states(entity_id) != 'off'
                and not is_number(state_attr(entity_id, 'temperature')) %}
            {% set ns.bad = true %}
          {% endif %}
        {% endfor %}
        {{ ns.bad }}

      highest_target: >-
        {% set ns = namespace(value=none) %}
        {% for entity_id in trvs %}
          {% if states(entity_id) != 'off' %}
            {% set target = state_attr(entity_id, 'temperature') %}
            {% if is_number(target) %}
              {% set target = target | float %}
              {% if ns.value is none or target > ns.value %}
                {% set ns.value = target %}
              {% endif %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.value if ns.value is not none else 0 }}

  - variables:
      target_to_send: >-
        {{ [
          (highest_target | float) + (boost | float),
          maximum_target | float
        ] | min | round(1) }}

  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ trvs | count <= 10
                 and (invalid_trv_state | string | trim | lower) != 'true'
                 and (active_count | int) == 0 }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ states(central) != 'off' }}"
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: "{{ central }}"
                data:
                  hvac_mode: "off"

      - conditions:
          - condition: template
            value_template: >-
              {{ trvs | count <= 10
                 and (invalid_trv_state | string | trim | lower) != 'true'
                 and (invalid_target | string | trim | lower) != 'true'
                 and (active_count | int) > 0 }}
        sequence:
          - if:
              - condition: template
                value_template: >-
                  {% set current = state_attr(central, 'temperature') %}
                  {{ states(central) != 'heat'
                     or not is_number(current)
                     or ((current | float) - (target_to_send | float)) | abs > 0.05 }}
            then:
              - action: climate.set_temperature
                target:
                  entity_id: "{{ central }}"
                data:
                  temperature: "{{ target_to_send }}"
                  hvac_mode: "heat"

mode: single
